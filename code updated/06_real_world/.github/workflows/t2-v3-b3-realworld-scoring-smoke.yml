name: T2 V3 B3 Real World Scoring Final Gate 5
on:
  push:
    branches: [t2-v3-contract-adapter-20261024]
    paths: ['.github/workflows/t2-v3-b3-realworld-scoring-smoke.yml']
  workflow_dispatch:
permissions: {contents: read, actions: read, packages: read}
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          name: t2-v3-rw-audit-profile-1
          run-id: 40142001843
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/realworld_regime_matched_v2
      - uses: actions/download-artifact@v5
        with:
          name: t2-v3-discovery-normal-seed0
          run-id: 40132811105
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/discovery_v3
      - name: Verify B3 Real World raw provenance and paired inference
        run: bash scripts/run_r_in_container.sh Rscript scripts/t2_v3_b3_realworld_scoring.R artifacts/realworld_regime_matched_v2/profile_batch_001 normal smoke
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: T2_V3_B3_realworld_scoring_smoke
          path: artifacts/realworld_T2_V3_B3
          retention-days: 90
