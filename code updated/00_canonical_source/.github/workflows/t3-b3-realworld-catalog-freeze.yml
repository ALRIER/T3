name: T3 B3 Fresh Real-world Parent Catalog Freeze
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  catalog-profile-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download archived candidate pool with checksums
        run: python3 scripts/t3_b3_prepare_realworld_candidates.py --out artifacts/T3_B3_realworld_archive_candidates
      - name: Collect new UCI parents and verify per-record CC BY evidence
        run: python3 scripts/t3_b3_collect_uci_realworld.py --out artifacts/T3_B3_realworld_uci_candidates --workers 6
      - name: Merge independent sources and check parent-level quotas
        run: |
          python3 scripts/t3_b3_merge_realworld_candidate_catalogs.py \
            artifacts/T3_B3_realworld_archive_candidates/candidate_catalog.csv \
            artifacts/T3_B3_realworld_uci_candidates/candidate_catalog.csv \
            --out artifacts/T3_B3_realworld_candidates/candidate_catalog.csv \
            --target-parents 642 --minimum-finance 200
      - name: Profile children without model outcomes
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
        run: |
          bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_profile_realworld_parent_children.R \
            artifacts/T3_B3_realworld_candidates/candidate_catalog.csv \
            artifacts/T3_B3_realworld_candidates/profiled "$GITHUB_SHA"
      - name: Freeze 642 parents using T3 profile matching
        run: |
          python3 scripts/t3_b3_freeze_realworld_parents.py \
            artifacts/T3_B3_realworld_candidates/profiled/outcome_blind_profiles.csv \
            --target-candidate-parents 642 --minimum-finance-parents 200 \
            --out artifacts/T3_B3_realworld_candidates/frozen
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-realworld-parent-freeze-run${{ github.run_id }}
          path: |
            artifacts/T3_B3_realworld_archive_candidates/
            artifacts/T3_B3_realworld_uci_candidates/
            artifacts/T3_B3_realworld_candidates/
          if-no-files-found: error
          retention-days: 90
