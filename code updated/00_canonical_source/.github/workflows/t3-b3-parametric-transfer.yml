name: T3 B3 Frozen Parametric Transfer
on:
  workflow_dispatch:
    inputs:
      discovery_run_id:
        description: Successful T3 B3 Discovery Actions run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: echo "matrix=$(python3 scripts/t3_b3_parametric_transfer_plan.py)" >> "$GITHUB_OUTPUT"
  transfer:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify completed Discovery source run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.discovery_run_id }}
        run: |
          gh run view "$RUN_ID" --repo "${{ github.repository }}" --json conclusion,workflowName \
            --jq '"\(.conclusion) \(.workflowName)"' \
            | grep -Fx 'success T3 Full Nested Optuna 5x3 Grid321'
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-discovery-${{ matrix.family }}-s*-n${{ matrix.n }}-run${{ inputs.discovery_run_id }}
          run-id: ${{ inputs.discovery_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/discovery_v3
          merge-multiple: true
      - name: Generate independent parameter-row Monte Carlo shard
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          mkdir -p incoming/parametric
          bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_parametric_transfer_mc.R \
            ${{ matrix.family }} ${{ matrix.parameter_row }} ${{ matrix.seed }} 500 ${{ matrix.n }}
      - name: Score against frozen Discovery weights without retuning
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          mc="artifacts/t3_b3_parametric_transfer_mc/${{ matrix.family }}/parameter_row$(printf '%02d' ${{ matrix.parameter_row }})/seed$(printf '%02d' ${{ matrix.seed }})/n${{ matrix.n }}_r500/canonical.rds"
          test -s "$mc"
          bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_parametric_transfer_score.R \
            ${{ matrix.family }} ${{ matrix.parameter_row }} ${{ matrix.seed }} ${{ matrix.n }} "$mc" artifacts/discovery_v3
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-parametric-${{ matrix.family }}-p${{ matrix.parameter_row }}-s${{ matrix.seed }}-n${{ matrix.n }}-run${{ github.run_id }}
          path: artifacts/t3_b3_parametric_transfer/${{ matrix.family }}/parameter_row*/seed*_n*
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: transfer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-parametric-*-run${{ github.run_id }}
          path: artifacts/t3_b3_parametric_transfer
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Global seed-level inference, taxonomy, and artifact
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
        run: bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_parametric_transfer_inference.R
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-parametric-transfer-global-run${{ github.run_id }}
          path: artifacts/t3_b3_parametric_transfer/aggregate
          if-no-files-found: error
          retention-days: 90
