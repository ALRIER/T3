name: T2 V3 B3 Integrated Integrity and Smoke Bubble
# Second integrated run after fixing missing R operator in regularization.
on:
  push:
    branches: [t2-v3-contract-adapter-20261024]
    paths: ['.github/workflows/t2-v3-b3-integrated-smoke-bubble.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: T2_V3_B3_integrated_smoke_bubble
  cancel-in-progress: false
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contract gates for Discovery Heldout Stress RealWorld
        run: |
          python3 scripts/t2_v3_b3_contract_gate.py
          python3 scripts/t2_v3_b3_nested_contract.py
          python3 scripts/t2_v3_b3_realworld_freeze_smoke.py
          python3 scripts/t2_v3_b3_taxonomy_ram_gate.py
          python3 scripts/t2_v3_b3_calibration_contract_smoke.py
  discovery:
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke Discovery four engines
        run: bash scripts/run_r_in_container.sh Rscript scripts/t2_v3_b3_integrated_smoke.R discovery
      - uses: actions/upload-artifact@v4
        with:
          name: T2_V3_B3_smoke_discovery
          path: artifacts/T2_V3_B3_integrated_smoke/
          if-no-files-found: error
  heldout:
    needs: discovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          name: T2_V3_B3_smoke_discovery
          path: artifacts/T2_V3_B3_integrated_smoke
      - name: Smoke Heldout with frozen Discovery weights
        run: bash scripts/run_r_in_container.sh Rscript scripts/t2_v3_b3_integrated_smoke.R heldout
      - uses: actions/upload-artifact@v4
        with:
          name: T2_V3_B3_smoke_heldout
          path: artifacts/T2_V3_B3_integrated_smoke/
          if-no-files-found: error
  stress:
    needs: discovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          name: T2_V3_B3_smoke_discovery
          path: artifacts/T2_V3_B3_integrated_smoke
      - name: Smoke Stress Test with frozen Discovery weights
        run: bash scripts/run_r_in_container.sh Rscript scripts/t2_v3_b3_integrated_smoke.R stress
      - uses: actions/upload-artifact@v4
        with:
          name: T2_V3_B3_smoke_stress
          path: artifacts/T2_V3_B3_integrated_smoke/
          if-no-files-found: error
  realworld:
    needs: discovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          name: T2_V3_B3_smoke_discovery
          path: artifacts/T2_V3_B3_integrated_smoke
      - name: Smoke Real World 26 estimators and frozen weights
        run: bash scripts/run_r_in_container.sh Rscript scripts/t2_v3_b3_integrated_smoke.R realworld
      - uses: actions/upload-artifact@v4
        with:
          name: T2_V3_B3_smoke_realworld
          path: artifacts/T2_V3_B3_integrated_smoke/
          if-no-files-found: error
  reconciliation:
    needs: [integrity,discovery,heldout,stress,realworld]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: T2_V3_B3_smoke_*
          path: smoke_outputs
      - name: Check all four independent stage outputs
        run: |
          test -s smoke_outputs/T2_V3_B3_smoke_discovery/frozen_models.rds
          test -s smoke_outputs/T2_V3_B3_smoke_discovery/discovery_taxonomy.csv
          test -s smoke_outputs/T2_V3_B3_smoke_heldout/heldout_inference.csv
          test -s smoke_outputs/T2_V3_B3_smoke_heldout/heldout_null.csv
          test -s smoke_outputs/T2_V3_B3_smoke_stress/stress_inference.csv
          test -s smoke_outputs/T2_V3_B3_smoke_stress/stress_null.csv
          test -s smoke_outputs/T2_V3_B3_smoke_realworld/realworld_scores.csv
          echo T2_V3_B3_INTEGRATED_INTEGRITY_AND_SMOKE_PASS
