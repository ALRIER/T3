name: T3 Publish Pinned R Runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/t3-publish-r-runtime.yml'
      - 'docker/Dockerfile.r-runtime'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.r-runtime
          push: true
          tags: ghcr.io/alrier/t3-r:4.3.3-statmod-v2
