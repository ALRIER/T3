name: T3 B3 Monte Carlo Actual Generator Pilot
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  generate-real-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable 321-cell prospective design
        run: python3 scripts/t2_v3_b3_generate_grid321.py
      - name: Authenticate to pinned R image registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull R runtime
        run: docker pull ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
      - name: Execute actual distribution, contamination, 26-estimator pilot
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_montecarlo_pilot.R normal discovery 0 3
      - name: Upload pilot data and provenance for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b3-mc-actual-normal-discovery-seed00-n200-r3-${{ github.run_id }}
          path: artifacts/mc_t3_grid321/t3_b3_grid321_v1/discovery/normal/seed00/n200_r3/
          retention-days: 30
          if-no-files-found: warn
  consumer-independent-runner:
    needs: generate-real-samples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: b3-mc-actual-normal-discovery-seed00-n200-r3-${{ github.run_id }}
          path: restored
      - name: Verify published SHA-256 and canonical R payload with Discovery reader
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
        run: |
          python3 - <<'PY'
          import csv,hashlib,pathlib
          root=pathlib.Path('restored')
          p=root/'canonical.rds'
          row=next(csv.DictReader((root/'manifest.csv').open()))
          assert row['scenarios']=='321' and row['reps']=='3'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256']
          print('T3_B3_MC_30_DAY_ARTIFACT_REDOWNLOAD_SHA256_PASS')
          PY
