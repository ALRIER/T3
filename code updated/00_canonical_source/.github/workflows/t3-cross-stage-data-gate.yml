name: T3 Cross Stage Data Contract Gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t3-cross-stage-data-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  interchange:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/t3_cross_stage_contract_gate.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/run_r_in_container.sh Rscript scripts/t3_grid321_nested_contract_smoke.R
