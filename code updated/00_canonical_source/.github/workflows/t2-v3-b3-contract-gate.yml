name: T2 V3 B3 Pre-MC Contract Reconciliation Gate
on:
  push:
    branches: [t2-v3-contract-adapter-20261024]
    paths: ['.github/workflows/t2-v3-b3-contract-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify historical contract mapping and B3 integration
        run: python3 scripts/t2_v3_b3_contract_gate.py
