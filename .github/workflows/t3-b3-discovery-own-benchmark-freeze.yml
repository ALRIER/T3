name: T3 B3 Discovery own-benchmark freeze
on:
  workflow_dispatch:
    inputs:
      discovery_run_id:
        description: Primary successful Discovery run
        required: true
        default: '41113724413'
        type: string
      discovery_retry_run_id:
        description: Successful Discovery repair run containing remaining immutable shards
        required: true
        default: '41207646731'
        type: string
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify immutable Discovery source runs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.discovery_run_id }}
          RETRY_RUN_ID: ${{ inputs.discovery_retry_run_id }}
        run: |
          for run in "$RUN_ID" "$RETRY_RUN_ID"; do
            gh run view "$run" --repo "${GITHUB_REPOSITORY}" --json conclusion,workflowName \
              --jq 'select(.conclusion=="success" and .workflowName=="T3 Full Nested Optuna 5x3 Grid321")' >/dev/null
          done
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-discovery-*-run${{ inputs.discovery_run_id }}
          run-id: ${{ inputs.discovery_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/discovery_v3
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-discovery-*-run${{ inputs.discovery_retry_run_id }}
          run-id: ${{ inputs.discovery_retry_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/discovery_v3
          merge-multiple: true
      - name: Freeze own-regime classical benchmark and compare W* with it and mean
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
        run: bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_discovery_benchmark_audit.R artifacts/discovery_v3
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-discovery-own-benchmark-map-run${{ github.run_id }}
          path: artifacts/discovery_v3/benchmark_audit_v2
          if-no-files-found: error
          retention-days: 90
