name: T3 B3 Discovery own-benchmark freeze
on:
  workflow_dispatch:
    inputs:
      discovery_run_ids:
        description: Comma-separated Discovery runs whose immutable shards complete the frozen W registry
        required: true
        default: '41113724413,41207646731'
        type: string
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download only immutable Discovery artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ inputs.discovery_run_ids }}
        run: |
          mkdir -p artifacts/discovery_v3
          IFS=',' read -ra runs <<< "$RUN_IDS"
          for run in "${runs[@]}"; do
            run="$(echo "$run" | xargs)"
            test -n "$run"
            gh run download "$run" --pattern 't3-b3-discovery-*' --dir artifacts/discovery_v3
          done
      - name: Freeze own-regime classical benchmark and compare W* with it and mean
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
        run: bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_discovery_benchmark_audit.R artifacts/discovery_v3
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-discovery-own-benchmark-map-run${{ github.run_id }}
          path: artifacts/discovery_v3/benchmark_audit_v2
          if-no-files-found: error
          retention-days: 90
