name: T3 B3 Frozen Cross-Family Transfer
"on":
  workflow_dispatch:
    inputs:
      mc_run_id:
        description: Successful T3 B3 FULL Monte Carlo run ID
        required: true
        type: string
      discovery_bundle_run_id:
        description: Successful run packaging the immutable Discovery shards by sample size
        required: true
        type: string
      role:
        description: Independent evaluation role
        required: true
        type: choice
        options: [heldout, stress]
      previous_partial_run_id:
        description: Earlier partial scoring run whose successful shards should be preserved
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.seed-plan.outputs.matrix }}
    steps:
      - id: seed-plan
        env:
          ROLE: ${{ inputs.role }}
          PARTIAL_RUN: ${{ inputs.previous_partial_run_id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os,re,subprocess
          role=os.environ['ROLE'];run=os.environ['PARTIAL_RUN'];repo=os.environ['REPOSITORY']
          d=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts?per_page=100'],text=True))
          done=set()
          pattern=re.compile(rf't3-b3-crossfamily-{role}-(normal|lognormal|weibull|invgauss|exgaussian|exwald)-s(\d+)-n(\d+)-run\d+')
          for art in d.get('artifacts',[]):
              m=pattern.fullmatch(art['name'])
              if m and not art.get('expired',False): done.add((m.group(1),int(m.group(2)),int(m.group(3))))
          families=['normal','lognormal','weibull','invgauss','exgaussian','exwald']
          seeds=range(10,20) if role=='heldout' else range(20,30)
          expected={(f,s,n) for f in families for s in seeds for n in (200,1000,3000)}
          if len(done)!=33: raise SystemExit(f'Expected exactly 33 successful reusable shards in partial run {run}; found {len(done)}')
          if not done<=expected: raise SystemExit('Partial run contains an unexpected transfer shard')
          missing=sorted(expected-done)
          print('matrix='+json.dumps({'include':[{'evaluation_family':f,'seed':s,'n':n} for f,s,n in missing]},separators=(',',':')))
          print(f'planned_missing={len(missing)}')
          PY
  transfer:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          name: t3-b3-discovery-bundle-n${{ matrix.n }}-run${{ inputs.discovery_bundle_run_id }}
          run-id: ${{ inputs.discovery_bundle_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/discovery
      - name: Materialize immutable Discovery models from bundle
        run: |
          mkdir -p artifacts/discovery_v3
          tar -xzf incoming/discovery/discovery-n${{ matrix.n }}.tar.gz -C artifacts/discovery_v3
          test "$(find artifacts/discovery_v3 -name discovery.rds -type f | wc -l)" -eq 60
      - uses: actions/download-artifact@v5
        with:
          name: b3-mc-${{ inputs.role }}-${{ matrix.evaluation_family }}-s${{ matrix.seed }}-n${{ matrix.n }}-run${{ inputs.mc_run_id }}
          run-id: ${{ inputs.mc_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/mc
      - name: Verify and materialize held-out Monte Carlo source
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
        run: bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_ingest_mc_artifact.R ${{ inputs.role }} ${{ matrix.evaluation_family }} ${{ matrix.seed }} ${{ matrix.n }} incoming/mc ${{ inputs.mc_run_id }}
      - name: Score every frozen source-family W on this evaluation family
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: bash scripts/run_r_in_container.sh Rscript scripts/v3_cross_family_frozen_production.R ${{ inputs.role }} ${{ matrix.evaluation_family }} ${{ matrix.seed }} ${{ matrix.n }}
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-crossfamily-${{ inputs.role }}-${{ matrix.evaluation_family }}-s${{ matrix.seed }}-n${{ matrix.n }}-run${{ github.run_id }}
          path: artifacts/v3_cross_family_scoring/${{ inputs.role }}
          if-no-files-found: error
          retention-days: 90
