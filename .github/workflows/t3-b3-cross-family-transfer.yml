name: T3 B3 Frozen Cross-Family Transfer
"on":
  workflow_dispatch:
    inputs:
      mc_run_id:
        description: Successful T3 B3 FULL Monte Carlo run ID
        required: true
        type: string
      discovery_bundle_ref:
        description: Private T3 branch containing SHA-256 verified Discovery bundles
        required: true
        default: t3-discovery-data-20261102
        type: string
      role:
        description: Independent evaluation role
        required: true
        type: choice
        options: [heldout, stress]
      previous_partial_run_id:
        description: Earlier partial scoring run whose successful shards should be preserved
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.seed-plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.discovery_bundle_ref }}
          path: plan-data
          sparse-checkout: bundles/partial_crossfamily_success.csv
          sparse-checkout-cone-mode: false
      - id: seed-plan
        env:
          ROLE: ${{ inputs.role }}
          PARTIAL_RUN: ${{ inputs.previous_partial_run_id }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json,os
          role=os.environ['ROLE'];run=os.environ['PARTIAL_RUN']
          with open('plan-data/bundles/partial_crossfamily_success.csv',newline='') as f:
              rows=list(csv.DictReader(f))
          done=set()
          for row in rows:
              if row['role']==role:
                  if row['source_run_id']!=run: raise SystemExit('Partial-shard manifest source run mismatch')
                  done.add((row['evaluation_family'],int(row['seed']),int(row['sample_n'])))
          families=['normal','lognormal','weibull','invgauss','exgaussian','exwald']
          seeds=range(10,20) if role=='heldout' else range(20,30)
          expected={(f,s,n) for f in families for s in seeds for n in (200,1000,3000)}
          if len(done)!=32: raise SystemExit(f'Expected exactly 32 successful reusable shards in partial run {run}; found {len(done)}')
          if not done<=expected: raise SystemExit('Partial run contains an unexpected transfer shard')
          missing=sorted(expected-done)
          print('matrix='+json.dumps({'include':[{'evaluation_family':f,'seed':s,'n':n} for f,s,n in missing]},separators=(',',':')))
          print(f'planned_missing={len(missing)}')
          PY
      - name: Preflight the Monte Carlo artifact download before opening the shard matrix
        if: inputs.role == 'heldout'
        uses: actions/download-artifact@v5
        with:
          name: b3-mc-heldout-normal-s10-n200-run${{ inputs.mc_run_id }}
          run-id: ${{ inputs.mc_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: preflight/mc
      - name: Preflight the Stress Monte Carlo artifact download before opening the shard matrix
        if: inputs.role == 'stress'
        uses: actions/download-artifact@v5
        with:
          name: b3-mc-stress-normal-s20-n200-run${{ inputs.mc_run_id }}
          run-id: ${{ inputs.mc_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: preflight/mc
  transfer:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the immutable Discovery bundle for this sample size
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.discovery_bundle_ref }}
          path: incoming/discovery-source
          sparse-checkout: |
            bundles/discovery-n${{ matrix.n }}.tar.gz
            bundles/discovery-n${{ matrix.n }}.tar.gz.sha256
          sparse-checkout-cone-mode: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize immutable Discovery models from bundle
        run: |
          mkdir -p artifacts/discovery_v3
          cd incoming/discovery-source/bundles
          sha256sum -c "discovery-n${{ matrix.n }}.tar.gz.sha256"
          tar -xzf "discovery-n${{ matrix.n }}.tar.gz" -C "$GITHUB_WORKSPACE/artifacts/discovery_v3"
          test "$(find "$GITHUB_WORKSPACE/artifacts/discovery_v3" -name discovery.rds -type f | wc -l)" -eq 60
      - uses: actions/download-artifact@v5
        with:
          name: b3-mc-${{ inputs.role }}-${{ matrix.evaluation_family }}-s${{ matrix.seed }}-n${{ matrix.n }}-run${{ inputs.mc_run_id }}
          run-id: ${{ inputs.mc_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/mc
      - name: Verify and materialize held-out Monte Carlo source
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
        run: bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_ingest_mc_artifact.R ${{ inputs.role }} ${{ matrix.evaluation_family }} ${{ matrix.seed }} ${{ matrix.n }} incoming/mc ${{ inputs.mc_run_id }}
      - name: Score every frozen source-family W on this evaluation family
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: bash scripts/run_r_in_container.sh Rscript scripts/v3_cross_family_frozen_production.R ${{ inputs.role }} ${{ matrix.evaluation_family }} ${{ matrix.seed }} ${{ matrix.n }}
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-crossfamily-${{ inputs.role }}-${{ matrix.evaluation_family }}-s${{ matrix.seed }}-n${{ matrix.n }}-run${{ github.run_id }}
          path: artifacts/v3_cross_family_scoring/${{ inputs.role }}
          if-no-files-found: error
          retention-days: 90
