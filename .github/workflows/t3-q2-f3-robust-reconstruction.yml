name: "T3 Q2 F3 — Robust reconstruction and conditional regime inference"
run-name: "Q2 F3 | original 18 blocks | robust effects and Q1 crosswalk | max-parallel 18"
"on":
  push:
    branches: [main]
    paths:
      - "Q2/F3/START_RUN.md"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: t3-q2-f3-robust-main
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"
jobs:
  f3-source-and-code-preflight:
    name: "F3-0 | original source manifest and analysis selftests"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install fixed numerical dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.1.3"
      - name: Verify original permanent source and F3 code
        run: |
          set -euo pipefail
          python -m py_compile scripts/t3_q2_f3_block.py scripts/t3_q2_f3_synthesis.py
          python scripts/t3_q2_f3_block.py selftest
          python scripts/t3_q2_f3_synthesis.py selftest
          test -s R1/runs/44324757704/synthesis/table_RQ1_72_method_family_sample_integrated.csv
          test -s Q2/runs/44599590079/synthesis/Q2_SCIENTIFIC_AUDIT.json
          count="$(find Q2/runs/44599590079/blocks -name Q2_BLOCK_MANIFEST.json | wc -l)"
          test "$count" -eq 18 || { echo "::error::Expected 18 original source manifests, got $count"; exit 1; }
          test -s Q2/F3/README.md
          echo "Q2_F3_ORIGINAL_SOURCE_AND_CODE_PREFLIGHT_PASS"
  f3-robust-reconstruction:
    name: "F3-1 | ${{ matrix.family }} n=${{ matrix.n }} | original 10x10 paired losses"
    needs: f3-source-and-code-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        family: [normal, lognormal, weibull, invgauss, exgaussian, exwald]
        n: [200, 1000, 3000]
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false, fetch-depth: 0, persist-credentials: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install fixed numerical dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.1.3"
      - name: Pin writable main to permanent original Q2 inputs
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - name: Reconstruct and verify original paired losses, robust ratios, and local observed neighbors
        env:
          FAMILY: ${{ matrix.family }}
          SAMPLE_N: ${{ matrix.n }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python scripts/t3_q2_f3_block.py block \
            --family "$FAMILY" --n "$SAMPLE_N" \
            --output "Q2/F3/runs/$RUN_ID/blocks/$FAMILY-n$SAMPLE_N"
          test -s "Q2/F3/runs/$RUN_ID/blocks/$FAMILY-n$SAMPLE_N/F3_BLOCK_MANIFEST.json"
      - name: Permanently preserve independently audited block in T3 main, with push-race retries
        env:
          RUN_ID: ${{ github.run_id }}
          FAMILY: ${{ matrix.family }}
          SAMPLE_N: ${{ matrix.n }}
        run: |
          set -euo pipefail
          bash scripts/t3_b3_q2_commit.sh "Q2/F3/runs/$RUN_ID/blocks/$FAMILY-n$SAMPLE_N"
  f3-synthesis-and-independent-null-validation:
    name: "F3-2 | Q1/Q2 reconciliation, crossed-null calibration and permanent synthesis"
    needs: [f3-source-and-code-preflight, f3-robust-reconstruction]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false, fetch-depth: 0, persist-credentials: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install fixed numerical dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.1.3"
      - name: Retrieve all 18 permanent F3 block commits
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          count="$(find "Q2/F3/runs/$RUN_ID/blocks" -name F3_BLOCK_MANIFEST.json -type f | wc -l)"
          test "$count" -eq 18 || { echo "::error::Expected 18 committed F3 manifests, got $count"; exit 1; }
      - name: Compute robust 18-block synthesis, exact policy inventory, and disjoint synthetic null validation
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python scripts/t3_q2_f3_synthesis.py run --root "Q2/F3/runs/$RUN_ID"
          test -s "Q2/F3/runs/$RUN_ID/synthesis/Q2_F3_SCIENTIFIC_AUDIT.json"
          test -s "Q2/F3/runs/$RUN_ID/synthesis/Q2_F3_SHA256_MANIFEST.json"
          echo "Q2_F3_SCIENTIFIC_VALIDATION_PASS"
      - name: Permanently preserve F3 tables, audit, calibrated surrogate output and hashes in T3 main
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/t3_b3_q2_commit.sh "Q2/F3/runs/$RUN_ID/synthesis"
          echo "Q2_F3_ALL_RESULTS_BACKED_UP_IN_T3_MAIN"
