name: T2 V3 B3 Real World Full Inferential Production
on:
  workflow_dispatch:
    inputs:
      b3_audit_run_id:
        description: 'Successful fresh T2 V3 B3 Real World recollection run ID (not V2)'
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: T2_V3_B3_realworld_inference
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.make.outputs.result }}
    steps:
      - id: make
        uses: actions/github-script@v7
        with:
          script: |
            const audit=await github.rest.actions.getWorkflowRun({
              owner:context.repo.owner,repo:context.repo.repo,run_id:Number(context.payload.inputs.b3_audit_run_id)});
            const training=await github.rest.actions.getWorkflowRun({
              owner:context.repo.owner,repo:context.repo.repo,run_id:40132811105});
            if(audit.data.name!=='T2 V3 B3 Fresh Real World Recollection'||audit.data.conclusion!=='success'||training.data.conclusion!=='success')
              return core.setFailed('Frozen Real World or Discovery source run incomplete');
            const a=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{
              owner:context.repo.owner,repo:context.repo.repo,run_id:Number(context.payload.inputs.b3_audit_run_id),per_page:100});
            const ids=a.filter(x=>!x.expired && /^T2_V3_B3_fresh_rw_profile-[0-9]+$/.test(x.name))
              .map(x=>Number(x.name.split('-').at(-1))).sort((x,y)=>x-y);
            if(!ids.length)return core.setFailed('No immutable audited parent datasets');
            return ids;
  freeze-parents:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          pattern: T2_V3_B3_fresh_rw_profile-*
          merge-multiple: true
          run-id: ${{ inputs.b3_audit_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/T2_V3_B3_fresh_profiles
      - name: Freeze newly collected B3 parents before scoring
        run: python3 scripts/t2_v3_b3_freeze_parents.py artifacts/T2_V3_B3_fresh_profiles
      - uses: actions/upload-artifact@v4
        with:
          name: T2_V3_B3_frozen_parent_manifest
          path: artifacts/T2_V3_B3_realworld_freeze/
          if-no-files-found: error
          retention-days: 90
  score_a:
    needs: [plan, freeze-parents]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        family: [normal, lognormal, weibull]
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          name: T2_V3_B3_fresh_rw_profile-${{ matrix.batch }}
          run-id: ${{ inputs.b3_audit_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/T2_V3_B3_fresh_profiles
      - uses: actions/download-artifact@v5
        with:
          pattern: t2-v3-discovery-${{ matrix.family }}-seed*
          merge-multiple: true
          run-id: 40132811105
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/discovery_v3
      - uses: actions/download-artifact@v5
        with:
          name: T2_V3_B3_frozen_parent_manifest
          path: artifacts/T2_V3_B3_realworld_freeze
      - name: Family-isolated dataset profiling, paired inference and memory audit
        env:
          FAMILY: ${{ matrix.family }}
          BATCH: ${{ matrix.batch }}
        run: |
          printf -v num '%03d' "$BATCH"
          bash scripts/run_r_in_container.sh Rscript scripts/t2_v3_b3_realworld_scoring.R "artifacts/T2_V3_B3_fresh_profiles/profile_batch_${num}" "$FAMILY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: T2_V3_B3_realworld_${{ matrix.family }}_batch${{ matrix.batch }}
          path: artifacts/realworld_T2_V3_B3
          if-no-files-found: error
          retention-days: 90
  score_b:
    needs: [plan, freeze-parents]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        family: [invgauss, exgaussian, exwald]
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          name: T2_V3_B3_fresh_rw_profile-${{ matrix.batch }}
          run-id: ${{ inputs.b3_audit_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/T2_V3_B3_fresh_profiles
      - uses: actions/download-artifact@v5
        with:
          pattern: t2-v3-discovery-${{ matrix.family }}-seed*
          merge-multiple: true
          run-id: 40132811105
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/discovery_v3
      - uses: actions/download-artifact@v5
        with:
          name: T2_V3_B3_frozen_parent_manifest
          path: artifacts/T2_V3_B3_realworld_freeze
      - name: Family-isolated dataset profiling, paired inference and memory audit
        env:
          FAMILY: ${{ matrix.family }}
          BATCH: ${{ matrix.batch }}
        run: |
          printf -v num '%03d' "$BATCH"
          bash scripts/run_r_in_container.sh Rscript scripts/t2_v3_b3_realworld_scoring.R "artifacts/T2_V3_B3_fresh_profiles/profile_batch_${num}" "$FAMILY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: T2_V3_B3_realworld_${{ matrix.family }}_batch${{ matrix.batch }}
          path: artifacts/realworld_T2_V3_B3
          if-no-files-found: error
          retention-days: 90
  parent-inference:
    needs: [score_a,score_b]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          pattern: T2_V3_B3_realworld_*_batch*
          merge-multiple: true
          path: artifacts/realworld_T2_V3_B3
      - name: Memory-safe independent parent-dataset inference and FDR
        run: bash scripts/run_r_in_container.sh Rscript scripts/t2_v3_b3_realworld_parent_inference.R
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: T2_V3_B3_realworld_parent_inference
          path: artifacts/realworld_T2_V3_B3/aggregation_T2_V3_B3
          if-no-files-found: error
          retention-days: 90
