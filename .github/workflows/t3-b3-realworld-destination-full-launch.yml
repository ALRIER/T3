name: T3 B3 Real World — One-time full destination benchmark recovery
run-name: "Real World full recovery | 856 frozen scorer artifacts | 720 W | audit 42257025451"
"on":
  push:
    branches: [main]
    paths:
      - 'config/T3_B3_RW_DESTINATION_FULL_LAUNCH_ONCE.txt'
permissions:
  contents: read
  actions: read
concurrency:
  group: t3-b3-realworld-destination-full-immutable-856
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  audit-frozen:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.10'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Validate updated scripts without executing scientific scoring
        run: |
          python -m py_compile scripts/t3_b3_realworld_v2_reduce.py scripts/t3_b3_realworld_v2_infer.py scripts/t3_b3_realworld_v2_reviewer.py
          python scripts/t3_b3_realworld_v2_reviewer.py selftest
          python - <<'PY'
          from scripts.t3_b3_realworld_v2_reduce import own_benchmark_family
          from scripts.t3_b3_realworld_v2_infer import calc
          assert own_benchmark_family('normal','weibull','source')=='normal'
          assert own_benchmark_family('normal','weibull','destination')=='weibull'
          rows=[(-.5-i*.1,-.7-i*.1,5+i,7+i) for i in range(6)]
          a=calc(rows,'test',500,('normal','weibull'))
          b=calc(rows,'test',500,('normal','weibull'))
          assert a==b and a['joint_parent_boot_ci_negative']
          print('REALWORLD_RECONCILE_POLICY_AND_BOOTSTRAP_SMOKE_PASS')
          PY
      - uses: actions/download-artifact@v5
        with:
          name: t3-rw-v2-recovered-720W-global-BH-taxonomy-run42251598557
          run-id: '42251598557'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/global
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-rw-v2-recovered-neighborhood-*-run42251598557
          run-id: '42251598557'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/neighbors
      - uses: actions/download-artifact@v5
        with:
          name: t3-b3-discovery-own-benchmark-map-run41478038812
          run-id: '41478038812'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/benchmark
      - uses: actions/download-artifact@v5
        with:
          name: t3-rw-v2-preserved-856-source-lineage-run42251598557
          run-id: '42251598557'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/ledger
      - name: Re-review 720-W global result and preserve source lineage
        run: |
          python scripts/t3_b3_realworld_v2_reviewer.py inspect \
            --global-root incoming/global --neighborhood-root incoming/neighbors \
            --output artifacts/reconcile_audit/reviewer --source-run 42251598557
      - name: Measure source versus empirical destination frozen benchmark disagreement without changing any outcome
        run: |
          python - <<'PY'
          import csv,gzip,hashlib,json,os,pathlib,shutil
          root=pathlib.Path('artifacts/reconcile_audit');root.mkdir(parents=True,exist_ok=True)
          b=list(pathlib.Path('incoming/benchmark').rglob('own_benchmark_map.csv'))
          n=list(pathlib.Path('incoming/neighbors').rglob('scenario_parent_coverage_descriptive.csv.gz'))
          l=list(pathlib.Path('incoming/ledger').rglob('full_input_source_ledger.json'))
          if len(b)!=1 or len(n)!=6 or len(l)!=1:raise ValueError('Incomplete frozen benchmark/neighbor/ledger audit inputs')
          src=json.loads(l[0].read_text())
          if src['source_shards']!=856 or src['reduction_jobs']!=216:raise ValueError('Historical 856-shard source lineage changed')
          def digest(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          mapping={}
          for row in csv.DictReader(b[0].open(newline='')):
           k=(row['evaluation_family'],int(row['scenario_id']),int(row['sample_n']))
           if k in mapping:raise ValueError('Duplicate frozen benchmark key')
           mapping[k]=row['own_benchmark']
          if len(mapping)!=6*241*3:raise ValueError('Expected exactly 4338 frozen classical benchmark cells')
          observed=set()
          for file in n:
           with gzip.open(file,'rt',newline='') as f:
            for row in csv.DictReader(f):
             k=(row['source_family'],row['evaluation_family'],int(row['matched_scenario_id']),int(row['sample_n']))
             observed.add(k)
          diffs=[]
          for sf,df,sid,sz in sorted(observed):
           ks=(sf,sid,sz);kd=(df,sid,sz)
           if ks not in mapping or kd not in mapping:raise ValueError('Missing matched support benchmark reference')
           if mapping[ks]!=mapping[kd]:
            diffs.append(dict(source_family=sf,empirical_destination_family=df,scenario_id=sid,sample_n=sz,
                              frozen_source_benchmark=mapping[ks],frozen_destination_benchmark=mapping[kd]))
          target=root/'benchmark_reference_disagreement.csv'
          with target.open('w',newline='') as f:
           w=csv.DictWriter(f,fieldnames=['source_family','empirical_destination_family','scenario_id','sample_n',
                                          'frozen_source_benchmark','frozen_destination_benchmark'])
           w.writeheader();w.writerows(diffs)
          meta={'protocol':'T3_B3_RW_BENCHMARK_POLICY_AUDIT_OUTCOME_BLIND',
                'frozen_original_score_shards':856,'frozen_candidate_count':720,
                'historical_global_run':42251598557,'original_score_reduction_run':42249952933,
                'source_ledger_sha256':digest(l[0]),'frozen_benchmark_sha256':digest(b[0]),
                'observed_source_destination_scenario_n_cells':len(observed),
                'differing_frozen_classic_benchmark_cells':len(diffs),
                'source_policy_preserved':True,
                'destination_policy_sensitivity_only':True,
                'rebuild_not_automatically_authorized':True,
                'code_commit':os.environ['GITHUB_SHA']}
          (root/'policy_audit.json').write_text(json.dumps(meta,indent=2)+'\n')
          shutil.copy2(l[0],root/'full_input_source_ledger.json')
          print('REALWORLD_BENCHMARK_POLICY_AUDIT_PASS',len(observed),'observed cells,',len(diffs),'different frozen references')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: t3-rw-v3-benchmark-policy-audit-run${{ github.run_id }}
          path: artifacts/reconcile_audit
          if-no-files-found: error
          retention-days: 90

  plan-destination:
    if: ${{ true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.source.outputs.matrix }}
      expected: ${{ steps.source.outputs.n_jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.10'}
      - name: Fail closed without a successful audit run and immutable audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RUN: 42257025451
        run: |
          set -euo pipefail
          [[ "$AUDIT_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/${{ github.repository }}/actions/runs/$AUDIT_RUN" --jq .conclusion)" = success
      - uses: actions/download-artifact@v5
        with:
          name: t3-rw-v3-benchmark-policy-audit-run42257025451
          run-id: 42257025451
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/audit
      - uses: actions/download-artifact@v5
        with:
          name: t3-b3-discovery-own-benchmark-map-run41478038812
          run-id: '41478038812'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/benchmark
      - name: Verify audit was based on the correct original 856 sources and comparator freeze
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('incoming/audit')
          a=json.loads((root/'policy_audit.json').read_text())
          ledger=root/'full_input_source_ledger.json'
          b=list(pathlib.Path('incoming/benchmark').rglob('own_benchmark_map.csv'))
          if a['historical_global_run']!=42251598557 or a['frozen_candidate_count']!=720 or len(b)!=1:
           raise ValueError('Not the approved original Real World audit panel')
          if hashlib.sha256(ledger.read_bytes()).hexdigest()!=a['source_ledger_sha256']:
           raise ValueError('The approved 856 original source ledger differs')
          if hashlib.sha256(b[0].read_bytes()).hexdigest()!=a['frozen_benchmark_sha256']:
           raise ValueError('The original Discovery benchmark map differs')
          if a['differing_frozen_classic_benchmark_cells']<=0:
           raise ValueError('No benchmark-policy difference: costly re-reduction is unnecessary')
          print('REALWORLD_RECONCILE_AUDIT_GUARD_PASS')
          PY
      - name: Re-inventory all 856 surviving original raw score artifacts; never rescore or refit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/t3_b3_realworld_v2_plan.py \
            --output artifacts/reconcile_destination/full_input_source_ledger.json \
            --github-output "$GITHUB_OUTPUT"
          python - <<'PY'
          import json,pathlib
          old=json.loads(pathlib.Path('incoming/audit/full_input_source_ledger.json').read_text())
          new=json.loads(pathlib.Path('artifacts/reconcile_destination/full_input_source_ledger.json').read_text())
          old_ids={a['artifact_id'] for a in old['all_artifacts']}
          new_ids={a['artifact_id'] for a in new['all_artifacts']}
          if old_ids!=new_ids or len(new_ids)!=856 or new['reduction_jobs']!=216:
           raise ValueError('Original scoring inventory changed between audit and requested destination rebuild')
          print('REALWORLD_RECONCILE_EXACT_SOURCE_ARTIFACT_IDENTITY_PASS',len(new_ids))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: t3-rw-v3-destination-856-source-ledger-run${{ github.run_id }}
          path: artifacts/reconcile_destination/full_input_source_ledger.json
          if-no-files-found: error
          retention-days: 90

  reduce-destination:
    needs: plan-destination
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 22
      matrix: ${{ fromJSON(needs.plan-destination.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.10'}
      - uses: actions/download-artifact@v5
        with:
          name: t3-b3-realworld-block-plan-run41514871500
          run-id: '41514871500'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/maps
      - uses: actions/download-artifact@v5
        with:
          name: t3-b3-discovery-own-benchmark-map-run41478038812
          run-id: '41478038812'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/benchmark
      - name: Re-reduce at most four immutable raw score artifacts without simulation or model training
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCES_JSON: ${{ toJSON(matrix.sources) }}
          SOURCE_FAMILY: ${{ matrix.family }}
        run: |
          python - <<'PY'
          import json,os,pathlib,shutil,subprocess
          sources=json.loads(os.environ['SOURCES_JSON'])
          family=os.environ['SOURCE_FAMILY']
          if not 1<=len(sources)<=4:raise ValueError('Unbounded Real World scoring archive batch')
          maps=list(pathlib.Path('incoming/maps').rglob('empirical_family_proximity.csv'))
          benches=list(pathlib.Path('incoming/benchmark').rglob('own_benchmark_map.csv'))
          if len(maps)!=1 or len(benches)!=1:raise ValueError('Frozen destination map and Discovery benchmark must be unique')
          out=pathlib.Path('artifacts/reconcile_destination/reduced')
          out.mkdir(parents=True,exist_ok=True)
          for src in sources:
           if src['family']!=family:raise ValueError('Unexpected original source family')
           aid=src['artifact_id'];temp=pathlib.Path('incoming/raw')/str(aid)
           temp.mkdir(parents=True,exist_ok=False)
           subprocess.run(['gh','run','download',str(src['run_id']),'--repo',os.environ['GITHUB_REPOSITORY'],
             '--name',src['artifact_name'],'--dir',str(temp)],check=True)
           scores=list(temp.rglob('scores.csv'))
           if len(scores)!=1:raise ValueError('One original score archive must have exactly one score CSV')
           subprocess.run(['python','scripts/t3_b3_realworld_v2_reduce.py',
             '--input',str(scores[0]),'--family-map',str(maps[0]),'--benchmark',str(benches[0]),
             '--own-policy','destination',
             '--output',str(out/f'parent_{aid}.csv.gz'),
             '--neighbor-output',str(out/f'neighbor_{aid}.csv.gz')],check=True)
           shutil.rmtree(temp)
          if len(list(out.glob('parent_*.csv.gz')))!=len(sources) or len(list(out.glob('neighbor_*.csv.gz')))!=len(sources):
           raise ValueError('Missing bounded reducer outputs')
          print('REALWORLD_DESTINATION_ONLY_REDUCER_PASS',family,len(sources))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: t3-rw-v3-destination-reduced-${{ matrix.family }}-b${{ matrix.block }}-run${{ github.run_id }}
          path: artifacts/reconcile_destination/reduced
          if-no-files-found: error
          retention-days: 90

  family-destination:
    needs: [plan-destination, reduce-destination]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        family: [normal,lognormal,weibull,invgauss,exgaussian,exwald]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.10'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - uses: actions/download-artifact@v5
        with:
          name: t3-rw-v3-destination-856-source-ledger-run${{ github.run_id }}
          path: incoming/ledger
      - name: Restore only this source family reduced checkpoint set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download '${{ github.run_id }}' --repo '${{ github.repository }}' \
            --pattern 't3-rw-v3-destination-reduced-${{ matrix.family }}-b*-run${{ github.run_id }}' \
            --dir incoming/reduced
      - name: Verify full original source coverage and frozen destination policy
        run: |
          python - <<'PY'
          import json,pathlib
          source=json.loads(pathlib.Path('incoming/ledger/full_input_source_ledger.json').read_text())
          fam='${{ matrix.family }}'
          expected=sum(x['family']==fam for x in source['all_artifacts'])
          p=list(pathlib.Path('incoming/reduced').rglob('parent_*.csv.gz'))
          n=list(pathlib.Path('incoming/reduced').rglob('neighbor_*.csv.gz'))
          manifests=list(pathlib.Path('incoming/reduced').rglob('parent_*.manifest.json'))
          if len(p)!=expected or len(n)!=expected or len(manifests)!=expected:
           raise ValueError('Incomplete source-family or hash lineage')
          ids=set()
          for path in manifests:
           m=json.loads(path.read_text())
           if m.get('own_benchmark_family_policy')!='destination':raise ValueError('Mixed benchmark policy')
           if m['raw_score_sha256'] in ids:raise ValueError('Duplicate original scorer')
           ids.add(m['raw_score_sha256'])
          print('REALWORLD_FAMILY_DESTINATION_COVERAGE_PASS',fam,expected)
          PY
      - name: Recalculate parent-independent inference with separate destination hypotheses and paired bootstrap sensitivity
        run: |
          python scripts/t3_b3_realworld_v2_infer.py family \
            --input incoming/reduced --family '${{ matrix.family }}' \
            --bootstrap-reps '2000' \
            --output artifacts/reconcile_destination/family/${{ matrix.family }}
      - name: Recalculate descriptive-only scenario adjacency without p-values
        run: |
          python scripts/t3_b3_realworld_v2_neighborhood.py \
            --input incoming/reduced --family '${{ matrix.family }}' \
            --grid config/T2_V3_B3_prospective_321_grid.csv \
            --output artifacts/reconcile_destination/neighborhood/${{ matrix.family }}
      - uses: actions/upload-artifact@v4
        with:
          name: t3-rw-v3-destination-parent-${{ matrix.family }}-run${{ github.run_id }}
          path: artifacts/reconcile_destination/family/${{ matrix.family }}
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: t3-rw-v3-destination-neighbors-${{ matrix.family }}-run${{ github.run_id }}
          path: artifacts/reconcile_destination/neighborhood/${{ matrix.family }}
          if-no-files-found: error
          retention-days: 90

  global-destination:
    needs: family-destination
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.10'}
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-rw-v3-destination-parent-*-run${{ github.run_id }}
          path: incoming/families
      - name: Apply one global BH adjustment in each prespecified parent and empirical-destination panel
        run: |
          python scripts/t3_b3_realworld_v2_infer.py global \
            --input incoming/families --output artifacts/reconcile_destination/global
          python - <<'PY'
          import csv,gzip,json,pathlib
          out=pathlib.Path('artifacts/reconcile_destination/global')
          m=json.loads((out/'scientific_provenance.json').read_text())
          if m['own_benchmark_family_policy']!='destination' or m['original_candidate_count']!=720:
           raise ValueError('Unexpected scientific benchmark policy or candidate registry')
          if m['primary_hypotheses']<=0 or m['secondary_hypotheses']<=0:
           raise ValueError('Empty global family of hypotheses')
          for name in ('primary_parent_BH_taxonomy.csv.gz','secondary_family_transfer_BH_taxonomy.csv.gz'):
           with gzip.open(out/name,'rt',newline='') as f:
            rows=list(csv.DictReader(f))
           if len({r['candidate_id'] for r in rows})!=720:
            raise ValueError('Lost original training-seed candidate identities')
          print('REALWORLD_V3_DESTINATION_COMPLETE_PRIMARY_SECONDARY_BH_PASS',m['primary_hypotheses'],m['secondary_hypotheses'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: t3-rw-v3-destination-global-taxonomy-run${{ github.run_id }}
          path: artifacts/reconcile_destination/global
          if-no-files-found: error
          retention-days: 90

  reviewer-and-handoff:
    needs: [plan-destination, global-destination, family-destination]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.10'}
      - uses: actions/download-artifact@v5
        with:
          name: t3-rw-v3-destination-global-taxonomy-run${{ github.run_id }}
          path: incoming/global
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-rw-v3-destination-neighbors-*-run${{ github.run_id }}
          path: incoming/neighbors
      - uses: actions/download-artifact@v5
        with:
          name: t3-rw-v3-destination-856-source-ledger-run${{ github.run_id }}
          path: incoming/ledger
      - name: Reviewer verifies all 720 individual W, BH taxonomy, parent coverage and descriptive neighborhood boundaries
        run: |
          python scripts/t3_b3_realworld_v2_reviewer.py inspect \
            --global-root incoming/global --neighborhood-root incoming/neighbors \
            --output artifacts/reconcile_destination/reviewer --source-run '${{ github.run_id }}'
      - name: Publish immutable Codex lineage, not a replacement for the original source-policy result
        env:
          AUDIT_RUN: 42257025451
        run: |
          python - <<'PY'
          import json,os,pathlib
          src=json.loads(pathlib.Path('incoming/ledger/full_input_source_ledger.json').read_text())
          result=json.loads(pathlib.Path('incoming/global/scientific_provenance.json').read_text())
          if src['source_shards']!=856 or result['own_benchmark_family_policy']!='destination':
           raise ValueError('Missing recovery lineage')
          out=pathlib.Path('artifacts/reconcile_destination/handoff')
          out.mkdir(parents=True,exist_ok=False)
          meta={'protocol':'T3_B3_RW_V3_DESTINATION_CLASSICAL_COMPARATOR_SENSITIVITY',
                'original_source_score_runs':src['original_source_runs'],
                'original_scorer_artifacts':856,'original_training_seeds':list(range(10)),
                'original_realworld_seeds':list(range(30,40)),
                'original_source_policy_global_run':42251598557,
                'audit_run':int(os.environ['AUDIT_RUN']),
                'destination_reduction_and_inference_run':int(os.environ['GITHUB_RUN_ID']),
                'frozen_parent_map_run':41514871500,'frozen_classical_benchmark_run':41478038812,
                'original_engine_averaged_tournament_run':41699936409,
                'distinct_original_candidate_W':720,
                'parent_unit':'parent_dataset_id',
                'reference_policy':'estimated_empirical_destination_family',
                'inference_status':'supplementary_benchmark_sensitivity_not_primary_replacement',
                'primary_hypotheses':result['primary_hypotheses'],
                'secondary_hypotheses':result['secondary_hypotheses'],
                'parent_bootstrap_reps':result['parent_bootstrap_reps'],
                'no_simulation_or_Discovery_refitting':True,'no_original_results_overwritten':True,
                'scoring_reexecution':False,'reviewer_required':True}
          (out/'codex_lineage.json').write_text(json.dumps(meta,indent=2)+'\n')
          (out/'CODEX_IMPORT.md').write_text(
           '# Real World benchmark reconciliation\n\n'
           'Keep the original 856 raw scores, the 720 individual Discovery W, and '
           'the successful source-family benchmark primary inference from run 42251598557. '
           'This destination-reference re-reduction is a separate sensitivity analysis; '
           'never append its rows to the old primary BH hypothesis family. '
           'Full scoring, Monte Carlo, and Discovery are not rerun. '
           'Use the frozen parent_id as the independent inferential unit; '
           'neighbor scenarios are descriptive only. '
           'Bootstrap CIs are sensitivity checks and do not override global BH. '
           'Control optimizers are not present in the 856 source artifacts and require separate work.\n')
          print('REALWORLD_V3_DESTINATION_FINAL_CODEX_PROVENANCE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: t3-rw-v3-destination-verified-reviewer-lineage-run${{ github.run_id }}
          path: |
            artifacts/reconcile_destination/reviewer
            artifacts/reconcile_destination/handoff
          if-no-files-found: error
          retention-days: 90
