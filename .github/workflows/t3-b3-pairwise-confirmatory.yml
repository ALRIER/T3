name: T3 B3 Pairwise all-benchmark confirmation
on:
  workflow_dispatch:
    inputs:
      confirmatory_run_id:
        description: Successful held-out/stress scoring run
        required: true
        type: string
      cross_family_run_id:
        description: Successful frozen cross-family scoring run
        required: true
        type: string
      stage:
        description: Independent evaluation stage
        required: true
        type: choice
        options: [heldout, stress]
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CONFIRM_RUN: ${{ inputs.confirmatory_run_id }}
          CROSS_RUN: ${{ inputs.cross_family_run_id }}
          STAGE: ${{ inputs.stage }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          repo=os.environ['GH_REPOSITORY']; stage=os.environ['STAGE']
          specs=[(os.environ['CONFIRM_RUN'],f't3-b3-{stage}-'),
                 (os.environ['CROSS_RUN'],f't3-b3-crossfamily-{stage}-')]
          matrix=[]
          for run,prefix in specs:
              page=1
              while True:
                  p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts?per_page=100&page={page}'],capture_output=True,text=True,check=True)
                  data=json.loads(p.stdout); arts=data.get('artifacts',[])
                  matrix.extend({'run_id':run,'artifact_id':x['id'],'artifact_name':x['name']}
                      for x in arts if x.get('expired') is False and x['name'].startswith(prefix))
                  if len(arts)<100: break
                  page+=1
          a=[x for x in matrix if x['run_id']==os.environ['CONFIRM_RUN']]
          b=[x for x in matrix if x['run_id']==os.environ['CROSS_RUN']]
          assert len(a)==180, f'Expected 180 within-family {stage} shards, found {len(a)}'
          assert len(b)==180, f'Expected 180 cross-family {stage} shards, found {len(b)}'
          assert len({x['artifact_id'] for x in matrix})==360, 'Duplicate Actions artifact IDs'
          print('matrix='+json.dumps({'include':matrix},separators=(',',':')))
          PY
      - name: Verify the two immutable scoring runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view ${{ inputs.confirmatory_run_id }} --repo ${{ github.repository }} --json conclusion,workflowName --jq 'select(.conclusion=="success" and .workflowName=="T3 B3 Held-out and Stress from immutable Actions artifacts")'
          gh run view ${{ inputs.cross_family_run_id }} --repo ${{ github.repository }} --json conclusion,workflowName --jq 'select(.conclusion=="success" and .workflowName=="T3 B3 Frozen Cross-Family Transfer")'
  reduce:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          run-id: ${{ matrix.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming
      - name: Reduce shard to independent evaluation-unit scores
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
        run: bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_reduce_tournament_shard.R ${{ inputs.stage }} incoming artifacts/reduced/units-${{ matrix.artifact_id }}.csv.gz
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-tournament-reduced-${{ inputs.stage }}-${{ matrix.artifact_id }}
          path: artifacts/reduced/units-${{ matrix.artifact_id }}.csv.gz
          if-no-files-found: error
          retention-days: 90
  infer:
    needs: [plan,reduce]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-tournament-reduced-${{ inputs.stage }}-*
          path: artifacts/reduced
          merge-multiple: true
      - name: Run the complete candidate x 26-benchmark x 2-metric global panel
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_tournament_from_reduced.R ${{ inputs.stage }} artifacts/reduced
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-pairwise-global-${{ inputs.stage }}-run${{ github.run_id }}
          path: artifacts/v3_confirmatory_pairwise/${{ inputs.stage }}_v2
          if-no-files-found: error
          retention-days: 90
