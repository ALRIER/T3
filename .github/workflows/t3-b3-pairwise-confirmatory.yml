name: T3 B3 Pairwise own-benchmark confirmation
on:
  workflow_dispatch:
    inputs:
      confirmatory_run_id:
        description: Successful held-out/stress scoring run
        required: true
        type: string
      partial_cross_family_run_id:
        description: Earlier partial transfer run with 32 successful reusable shards
        required: true
        type: string
      repair_cross_family_run_id:
        description: Repair run completing the remaining transfer shards
        required: true
        type: string
      benchmark_map_run_id:
        description: Successful Discovery own-benchmark freeze run ID
        required: true
        type: string
      stage:
        description: Independent evaluation stage
        required: true
        type: choice
        options: [heldout, stress]
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CONFIRM_RUN: ${{ inputs.confirmatory_run_id }}
          PARTIAL_RUN: ${{ inputs.partial_cross_family_run_id }}
          REPAIR_RUN: ${{ inputs.repair_cross_family_run_id }}
          STAGE: ${{ inputs.stage }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os,re,subprocess
          stage=os.environ['STAGE'];repo=os.environ['GH_REPOSITORY']
          partial_run=os.environ['PARTIAL_RUN'];repair_run=os.environ['REPAIR_RUN']
          cross_runs=[partial_run,repair_run]
          specs=[(os.environ['CONFIRM_RUN'],f't3-b3-{stage}-'),
                 (partial_run,f't3-b3-crossfamily-{stage}-'),
                 (repair_run,f't3-b3-crossfamily-{stage}-')]
          arts=[]
          for run,prefix in specs:
              page=1
              while True:
                  d=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts?per_page=100&page={page}'],text=True))
                  items=d.get('artifacts',[])
                  arts.extend({'run_id':run,'name':x['name'],'id':x['id']} for x in items if not x.get('expired',False) and x['name'].startswith(prefix))
                  if len(items)<100:break
                  page+=1
          within=[x for x in arts if x['run_id']==os.environ['CONFIRM_RUN']]
          cross=[x for x in arts if x['run_id'] in cross_runs]
          within_pat=re.compile(rf't3-b3-{stage}-(normal|lognormal|weibull|invgauss|exgaussian|exwald)-s(\d+)-n(\d+)-run\d+')
          cross_pat=re.compile(rf't3-b3-crossfamily-{stage}-(normal|lognormal|weibull|invgauss|exgaussian|exwald)-s(\d+)-n(\d+)-run\d+')
          def keys(items,pat):
              out=[]
              for x in items:
                  m=pat.fullmatch(x['name'])
                  if not m:raise SystemExit('Unexpected score artifact name: '+x['name'])
                  out.append((x['run_id'],m.group(1),int(m.group(2)),int(m.group(3))))
              return out
          wkeys=keys(within,within_pat);ckeys=keys(cross,cross_pat)
          if len(within)!=180 or len({x[1:] for x in wkeys})!=180:raise SystemExit('Within-family score panel is incomplete or duplicated')
          if len(cross)!=180 or len({x[1:] for x in ckeys})!=180:raise SystemExit('Cross-family score panel is incomplete or duplicated')
          partial=[x for x in ckeys if x[0]==partial_run]
          if len(partial)!=32:raise SystemExit(f'Expected 32 reusable partial artifacts, found {len(partial)}')
          seeds=range(10,20) if stage=='heldout' else range(20,30)
          expected={(f,s,n) for f in ['normal','lognormal','weibull','invgauss','exgaussian','exwald'] for s in seeds for n in (200,1000,3000)}
          if not {(f,s,n) for _,f,s,n in ckeys}==expected:raise SystemExit('Cross-family score panel has an unexpected scope')
          blocks=[]
          for family in ['normal','lognormal','weibull','invgauss','exgaussian','exwald']:
              for n in (200,1000,3000):
                  partial_count=sum(x[0]==partial_run and x[1]==family and x[3]==n for x in ckeys)
                  repair_count=sum(x[0]==repair_run and x[1]==family and x[3]==n for x in ckeys)
                  if partial_count+repair_count!=10:raise SystemExit(f'Incomplete block {family}/n{n}')
                  blocks.append({'family':family,'n':n,'partial_count':partial_count,'repair_count':repair_count})
          print('matrix='+json.dumps({'include':blocks},separators=(',',':')))
          PY
      - name: Preflight a held-out score artifact before opening reducer blocks
        if: inputs.stage == 'heldout'
        uses: actions/download-artifact@v5
        with:
          name: t3-b3-heldout-normal-s10-n200-run${{ inputs.confirmatory_run_id }}
          run-id: ${{ inputs.confirmatory_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: preflight/score
      - name: Preflight a Stress score artifact before opening reducer blocks
        if: inputs.stage == 'stress'
        uses: actions/download-artifact@v5
        with:
          name: t3-b3-stress-normal-s20-n200-run${{ inputs.confirmatory_run_id }}
          run-id: ${{ inputs.confirmatory_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: preflight/score
  reduce:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all within-family score shards with paginated artifact listing
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.confirmatory_run_id }}
          ARTIFACT_PATTERN: t3-b3-${{ inputs.stage }}-${{ matrix.family }}-s*-n${{ matrix.n }}-run*
        run: gh run download "$RUN_ID" --repo "$REPOSITORY" --pattern "$ARTIFACT_PATTERN" --dir incoming/within
      - name: Download partial cross-family score shards with paginated artifact listing
        if: matrix.partial_count > 0
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.partial_cross_family_run_id }}
          ARTIFACT_PATTERN: t3-b3-crossfamily-${{ inputs.stage }}-${{ matrix.family }}-s*-n${{ matrix.n }}-run*
        run: gh run download "$RUN_ID" --repo "$REPOSITORY" --pattern "$ARTIFACT_PATTERN" --dir incoming/cross
      - name: Download repaired cross-family score shards with paginated artifact listing
        if: matrix.repair_count > 0
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.repair_cross_family_run_id }}
          ARTIFACT_PATTERN: t3-b3-crossfamily-${{ inputs.stage }}-${{ matrix.family }}-s*-n${{ matrix.n }}-run*
        run: gh run download "$RUN_ID" --repo "$REPOSITORY" --pattern "$ARTIFACT_PATTERN" --dir incoming/cross
      - name: Assert every source shard is present before reduction
        env:
          EXPECTED_CROSS: ${{ matrix.partial_count + matrix.repair_count }}
        run: |
          within_count=$(find incoming/within -type f -name scores.csv | wc -l)
          cross_count=$(find incoming/cross -type f -name scores.csv | wc -l)
          test "$within_count" -eq 10
          test "$cross_count" -eq "$EXPECTED_CROSS"
          test "$cross_count" -eq 10
      - name: Reduce shard to independent evaluation-unit scores
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
        run: bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_reduce_tournament_shard.R ${{ inputs.stage }} incoming artifacts/reduced/units-${{ matrix.family }}-n${{ matrix.n }}.csv.gz
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-tournament-reduced-${{ inputs.stage }}-${{ matrix.family }}-n${{ matrix.n }}
          path: artifacts/reduced/units-${{ matrix.family }}-n${{ matrix.n }}.csv.gz
          if-no-files-found: error
          retention-days: 90
  infer:
    needs: [plan,reduce]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-tournament-reduced-${{ inputs.stage }}-*
          path: artifacts/reduced
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          name: t3-b3-discovery-own-benchmark-map-run${{ inputs.benchmark_map_run_id }}
          run-id: ${{ inputs.benchmark_map_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/benchmark_map
      - name: Run the candidate x own-benchmark/mean x two-metric global panel
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_tournament_from_reduced.R ${{ inputs.stage }} artifacts/reduced artifacts/benchmark_map/own_benchmark_map.csv
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-pairwise-global-${{ inputs.stage }}-run${{ github.run_id }}
          path: artifacts/v3_confirmatory_pairwise/${{ inputs.stage }}_v3
          if-no-files-found: error
          retention-days: 90
