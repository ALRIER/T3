name: T3 B3 Pairwise own-benchmark confirmation
on:
  workflow_dispatch:
    inputs:
      confirmatory_run_id:
        description: Successful held-out/stress scoring run
        required: true
        type: string
      partial_cross_family_run_id:
        description: Earlier partial transfer run with 32 successful reusable shards
        required: true
        type: string
      repair_cross_family_run_id:
        description: Repair run completing the remaining transfer shards
        required: true
        type: string
      benchmark_map_run_id:
        description: Successful Discovery own-benchmark freeze run ID
        required: true
        type: string
      transport_ref:
        description: Private branch containing the verified partial-shard manifest
        required: true
        default: t3-discovery-data-20261102
        type: string
      stage:
        description: Independent evaluation stage
        required: true
        type: choice
        options: [heldout, stress]
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.transport_ref }}
          path: plan-data
          sparse-checkout: bundles/partial_crossfamily_success.csv
          sparse-checkout-cone-mode: false
      - id: plan
        env:
          PARTIAL_RUN: ${{ inputs.partial_cross_family_run_id }}
          STAGE: ${{ inputs.stage }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json,os
          stage=os.environ['STAGE'];partial_run=os.environ['PARTIAL_RUN']
          with open('plan-data/bundles/partial_crossfamily_success.csv',newline='') as f:
              rows=list(csv.DictReader(f))
          stage_rows=[r for r in rows if r['role']==stage]
          done=[(r['evaluation_family'],int(r['seed']),int(r['sample_n'])) for r in stage_rows]
          if len(stage_rows)!=32 or any(r['source_run_id']!=partial_run for r in stage_rows) or len(set(done))!=32:
              raise SystemExit('Partial successful-shard manifest is incomplete or has the wrong source run')
          blocks=[]
          for family in ['normal','lognormal','weibull','invgauss','exgaussian','exwald']:
              for n in (200,1000,3000):
                  partial_count=sum(r['role']==stage and r['source_run_id']==partial_run and
                    r['evaluation_family']==family and int(r['sample_n'])==n for r in rows)
                  repair_count=10-partial_count
                  blocks.append({'family':family,'n':n,'partial_count':partial_count,'repair_count':repair_count})
          print('matrix='+json.dumps({'include':blocks},separators=(',',':')))
          PY
      - name: Preflight a held-out score artifact before opening reducer blocks
        if: inputs.stage == 'heldout'
        uses: actions/download-artifact@v5
        with:
          name: t3-b3-heldout-normal-s10-n200-run${{ inputs.confirmatory_run_id }}
          run-id: ${{ inputs.confirmatory_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: preflight/score
      - name: Preflight a Stress score artifact before opening reducer blocks
        if: inputs.stage == 'stress'
        uses: actions/download-artifact@v5
        with:
          name: t3-b3-stress-normal-s20-n200-run${{ inputs.confirmatory_run_id }}
          run-id: ${{ inputs.confirmatory_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: preflight/score
  reduce:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-${{ inputs.stage }}-${{ matrix.family }}-s*-n${{ matrix.n }}-run*
          run-id: ${{ inputs.confirmatory_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/within
          merge-multiple: true
      - uses: actions/download-artifact@v5
        if: matrix.partial_count > 0
        with:
          pattern: t3-b3-crossfamily-${{ inputs.stage }}-${{ matrix.family }}-s*-n${{ matrix.n }}-run*
          run-id: ${{ inputs.partial_cross_family_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/cross
          merge-multiple: true
      - uses: actions/download-artifact@v5
        if: matrix.repair_count > 0
        with:
          pattern: t3-b3-crossfamily-${{ inputs.stage }}-${{ matrix.family }}-s*-n${{ matrix.n }}-run*
          run-id: ${{ inputs.repair_cross_family_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/cross
          merge-multiple: true
      - name: Reduce shard to independent evaluation-unit scores
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
        run: bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_reduce_tournament_shard.R ${{ inputs.stage }} incoming artifacts/reduced/units-${{ matrix.family }}-n${{ matrix.n }}.csv.gz
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-tournament-reduced-${{ inputs.stage }}-${{ matrix.family }}-n${{ matrix.n }}
          path: artifacts/reduced/units-${{ matrix.family }}-n${{ matrix.n }}.csv.gz
          if-no-files-found: error
          retention-days: 90
  infer:
    needs: [plan,reduce]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-tournament-reduced-${{ inputs.stage }}-*
          path: artifacts/reduced
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          name: t3-b3-discovery-own-benchmark-map-run${{ inputs.benchmark_map_run_id }}
          run-id: ${{ inputs.benchmark_map_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/benchmark_map
      - name: Run the candidate x own-benchmark/mean x two-metric global panel
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_tournament_from_reduced.R ${{ inputs.stage }} artifacts/reduced artifacts/benchmark_map/own_benchmark_map.csv
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-pairwise-global-${{ inputs.stage }}-run${{ github.run_id }}
          path: artifacts/v3_confirmatory_pairwise/${{ inputs.stage }}_v3
          if-no-files-found: error
          retention-days: 90
