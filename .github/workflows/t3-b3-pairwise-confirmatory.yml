name: T3 B3 Pairwise own-benchmark confirmation
on:
  workflow_dispatch:
    inputs:
      confirmatory_run_id:
        description: Successful held-out/stress scoring run
        required: true
        type: string
      partial_cross_family_run_id:
        description: Earlier partial transfer run with 33 successful reusable shards
        required: true
        type: string
      repair_cross_family_run_id:
        description: Repair run completing the remaining transfer shards
        required: true
        type: string
      benchmark_map_run_id:
        description: Successful Discovery own-benchmark freeze run ID
        required: true
        type: string
      stage:
        description: Independent evaluation stage
        required: true
        type: choice
        options: [heldout, stress]
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CONFIRM_RUN: ${{ inputs.confirmatory_run_id }}
          CROSS_RUNS: ${{ inputs.partial_cross_family_run_id }},${{ inputs.repair_cross_family_run_id }}
          STAGE: ${{ inputs.stage }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          repo=os.environ['GH_REPOSITORY']; stage=os.environ['STAGE']
          cross_runs=[x.strip() for x in os.environ['CROSS_RUNS'].split(',') if x.strip()]
          specs=[(os.environ['CONFIRM_RUN'],f't3-b3-{stage}-')]+[
                 (run,f't3-b3-crossfamily-{stage}-') for run in cross_runs]
          artifacts=[]
          for run,prefix in specs:
              page=1
              while True:
                  p=subprocess.run(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts?per_page=100&page={page}'],capture_output=True,text=True,check=True)
                  data=json.loads(p.stdout); arts=data.get('artifacts',[])
                  artifacts.extend({'run_id':run,'artifact_id':x['id'],'artifact_name':x['name']}
                      for x in arts if x.get('expired') is False and x['name'].startswith(prefix))
                  if len(arts)<100: break
                  page+=1
          a=[x for x in artifacts if x['run_id']==os.environ['CONFIRM_RUN']]
          b=[x for x in artifacts if x['run_id'] in cross_runs]
          assert len(a)==180, f'Expected 180 within-family {stage} shards, found {len(a)}'
          import re
          within_pat=re.compile(rf't3-b3-{stage}-(normal|lognormal|weibull|invgauss|exgaussian|exwald)-s(\d+)-n(\d+)-run\d+')
          pat=re.compile(rf't3-b3-crossfamily-{stage}-(normal|lognormal|weibull|invgauss|exgaussian|exwald)-s(\d+)-n(\d+)-run\d+')
          within_keys=[];keys=[]
          for x in a:
              m=within_pat.fullmatch(x['artifact_name'])
              assert m, f'Unexpected within-family shard identity: {x["artifact_name"]}'
              within_keys.append((m.group(1),int(m.group(3)),int(m.group(2))))
          assert len(set(within_keys))==180, 'Within-family scoring shards are duplicated or incomplete'
          for x in b:
              m=pat.fullmatch(x['artifact_name'])
              assert m, f'Unexpected cross-family shard identity: {x["artifact_name"]}'
              keys.append((m.group(1),int(m.group(2)),int(m.group(3))))
          assert len(b)==180 and len(set(keys))==180, f'Expected 180 unique cross-family {stage} shards, found {len(set(keys))}'
          blocks=[]
          for family in ['normal','lognormal','weibull','invgauss','exgaussian','exwald']:
              for n in (200,1000,3000):
                  within_count=sum(k[0]==family and k[1]==n for k in within_keys)
                  partial_count=sum(x['run_id']==cross_runs[0] and k[0]==family and k[2]==n for x,k in zip(b,keys))
                  repair_count=sum(x['run_id']==cross_runs[1] and k[0]==family and k[2]==n for x,k in zip(b,keys))
                  assert within_count==10, f'Expected 10 within shards in {family}/n{n}, found {within_count}'
                  assert partial_count+repair_count==10, f'Expected 10 cross-family shards in {family}/n{n}'
                  blocks.append({'family':family,'n':n,'partial_count':partial_count,'repair_count':repair_count})
          print('matrix='+json.dumps({'include':blocks},separators=(',',':')))
          PY
  reduce:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-${{ inputs.stage }}-${{ matrix.family }}-s*-n${{ matrix.n }}-run*
          run-id: ${{ inputs.confirmatory_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/within
          merge-multiple: true
      - uses: actions/download-artifact@v5
        if: matrix.partial_count > 0
        with:
          pattern: t3-b3-crossfamily-${{ inputs.stage }}-${{ matrix.family }}-s*-n${{ matrix.n }}-run*
          run-id: ${{ inputs.partial_cross_family_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/cross
          merge-multiple: true
      - uses: actions/download-artifact@v5
        if: matrix.repair_count > 0
        with:
          pattern: t3-b3-crossfamily-${{ inputs.stage }}-${{ matrix.family }}-s*-n${{ matrix.n }}-run*
          run-id: ${{ inputs.repair_cross_family_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/cross
          merge-multiple: true
      - name: Reduce shard to independent evaluation-unit scores
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
        run: bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_reduce_tournament_shard.R ${{ inputs.stage }} incoming artifacts/reduced/units-${{ matrix.family }}-n${{ matrix.n }}.csv.gz
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-tournament-reduced-${{ inputs.stage }}-${{ matrix.family }}-n${{ matrix.n }}
          path: artifacts/reduced/units-${{ matrix.family }}-n${{ matrix.n }}.csv.gz
          if-no-files-found: error
          retention-days: 90
  infer:
    needs: [plan,reduce]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-tournament-reduced-${{ inputs.stage }}-*
          path: artifacts/reduced
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          name: t3-b3-discovery-own-benchmark-map-run${{ inputs.benchmark_map_run_id }}
          run-id: ${{ inputs.benchmark_map_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/benchmark_map
      - name: Run the candidate x own-benchmark/mean x two-metric global panel
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_tournament_from_reduced.R ${{ inputs.stage }} artifacts/reduced artifacts/benchmark_map/own_benchmark_map.csv
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-pairwise-global-${{ inputs.stage }}-run${{ github.run_id }}
          path: artifacts/v3_confirmatory_pairwise/${{ inputs.stage }}_v3
          if-no-files-found: error
          retention-days: 90
