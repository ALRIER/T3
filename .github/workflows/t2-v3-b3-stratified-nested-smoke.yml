name: T2 B3 Stratified Nested CV 5x3 Smoke
on:
  push:
    branches: [t2-v3-contract-adapter-20261024]
    paths: ['.github/workflows/t2-v3-b3-stratified-nested-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  nested-cv-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/run_r_in_container.sh Rscript scripts/t2_v3_b3_nested_folds_smoke.R
