name: T3 Nested Optuna 5x3 Grid321
on:
  workflow_call:
    inputs:
      mc_run_id:
        required: true
        type: string
      outer_fold:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      mc_run_id:
        description: 'Successful T3 discovery Monte Carlo run ID; no T2 run IDs'
        required: true
        type: string
      outer_fold:
        description: 'External fold 1 through 5; dispatch separately for each fold'
        required: true
        type: choice
        options: ['1','2','3','4','5']
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: t3-nested-${{ inputs.outer_fold }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          z=[dict(family=f,seed=s,n=n) for f in ['normal','lognormal','weibull','invgauss','exgaussian','exwald'] for s in range(10) for n in [200,1000,3000]]
          assert len(z)==180
          print('matrix='+json.dumps({'include':z},separators=(',',':')))
          PY
  nested:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify source run belongs to T3 and completed successfully
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.mc_run_id }}
        run: |
          gh run view "$RUN" --repo "${{ github.repository }}" --json conclusion,workflowName \
            --jq '"\(.conclusion) \(.workflowName)"' \
            | grep -Fx 'success T3 B3 FULL Monte Carlo 321 x 500'
      - uses: actions/download-artifact@v5
        with:
          name: b3-mc-discovery-${{ matrix.family }}-s${{ matrix.seed }}-n${{ matrix.n }}-run${{ inputs.mc_run_id }}
          run-id: ${{ inputs.mc_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/mc
      - name: Verify and materialize immutable Monte Carlo source
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
        run: bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_ingest_mc_artifact.R discovery ${{ matrix.family }} ${{ matrix.seed }} ${{ matrix.n }} incoming/mc ${{ inputs.mc_run_id }}
      - name: Install reproducible hyperparameter tuner
        run: python3 -m pip install --user 'optuna==4.9.0'
      - name: Tune four engines using three internal folds
        run: python3 scripts/t2_v3_b3_nested_optuna.py "${{ matrix.family }}" "${{ matrix.seed }}" "${{ inputs.outer_fold }}" "${{ matrix.n }}" --trials 8
      - name: Refit four engines and score withheld external fold
        run: bash scripts/run_r_in_container.sh Rscript scripts/t2_v3_b3_discovery_cv5_refit.R "${{ matrix.family }}" "${{ matrix.seed }}" "${{ inputs.outer_fold }}" "${{ matrix.n }}"
      - uses: actions/upload-artifact@v4
        with:
          name: t3-nested-${{ matrix.family }}-seed${{ matrix.seed }}-n${{ matrix.n }}-fold${{ inputs.outer_fold }}
          path: |
            artifacts/T2_V3_B3_nested_optuna/
            artifacts/T2_V3_B3_discovery_cv5_refit/
          if-no-files-found: error
          retention-days: 90
