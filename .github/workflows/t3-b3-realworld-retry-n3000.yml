name: T3 B3 Retry cancelled Real-world n3000 shards

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: Real-world scoring run with cancelled n=3000 shards
        required: true
        default: '41208956012'
        type: string
      catalog_run_id:
        description: Frozen parent catalog run
        required: true
        default: '40508641708'
        type: string
      discovery_run_id:
        description: Original Discovery run containing successful frozen weights
        required: true
        default: '41113724413'
        type: string
      discovery_retry_run_id:
        description: Selective Discovery repair run containing repaired weights
        required: true
        default: '41207646731'
        type: string

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      base_keys: ${{ steps.plan.outputs.base_keys }}
      retry_count: ${{ steps.plan.outputs.retry_count }}
    steps:
      - uses: actions/checkout@v4
      - name: Freeze cancelled n=3000 keys and split the ten Discovery seeds in two
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess, time
          run=os.environ['FAILED_RUN_ID']
          jobs=[]
          for page in range(1, 8):
              for attempt in range(6):
                  p=subprocess.run(['gh','api',f"repos/{os.environ['GH_REPOSITORY']}/actions/runs/{run}/jobs?per_page=100&page={page}"],capture_output=True,text=True)
                  if p.returncode == 0:
                      try: data=json.loads(p.stdout); break
                      except json.JSONDecodeError: pass
                  time.sleep(3)
              else: raise SystemExit(p.stderr or 'Could not retrieve failed run job list')
              jobs.extend(data.get('jobs',[]))
              if len(data.get('jobs',[])) < 100: break
          pat=re.compile(r'^score \(([^,]+),\s*(\d+),\s*(\d+)\)$')
          failed=[]
          for j in jobs:
              m=pat.match(j.get('name',''))
              if m and j.get('conclusion') == 'cancelled' and int(m.group(3)) == 3000:
                  failed.append({'family':m.group(1),'seed':int(m.group(2)),'n':int(m.group(3))})
          keys={(x['family'],x['seed'],x['n']) for x in failed}
          expected_families={'normal','lognormal','weibull','invgauss','exgaussian','exwald'}
          assert len(failed)==52 and len(keys)==52, f'Expected exactly 52 unique cancelled n=3000 shards, got {len(failed)}'
          assert {x['family'] for x in failed}==expected_families
          assert all(x['seed'] in range(30,40) for x in failed)
          groups=[('0_1_2_3_4','0,1,2,3,4'),('5_6_7_8_9','5,6,7,8,9')]
          matrix=[dict(**x,group=label,training_seeds=seeds) for x in sorted(failed,key=lambda v:(v['family'],v['seed'])) for label,seeds in groups]
          assert len(matrix)==104
          print('matrix='+json.dumps({'include':matrix},separators=(',',':')))
          print('base_keys='+json.dumps(sorted([list(k) for k in keys]),separators=(',',':')))
          print('retry_count='+str(len(matrix)))
          PY
      - name: Verify immutable source runs
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_RUN_ID: ${{ inputs.catalog_run_id }}
          DISCOVERY_RUN_ID: ${{ inputs.discovery_run_id }}
          DISCOVERY_RETRY_RUN_ID: ${{ inputs.discovery_retry_run_id }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
        run: |
          gh run view "$CATALOG_RUN_ID" --repo "${{ github.repository }}" --json conclusion,workflowName \
            --jq '"\(.conclusion) \(.workflowName)"' \
            | grep -Fx 'success T3 B3 Fresh Real-world Parent Catalog Freeze'
          gh run view "$DISCOVERY_RUN_ID" --repo "${{ github.repository }}" --json status,workflowName \
            --jq '"\(.status) \(.workflowName)"' \
            | grep -Fx 'completed T3 Repair failed nested jobs and continue Discovery'
          gh run view "$DISCOVERY_RETRY_RUN_ID" --repo "${{ github.repository }}" --json conclusion,workflowName \
            --jq '"\(.conclusion) T3 Resume selected Discovery jobs"' \
            | grep -Fx 'success T3 Resume selected Discovery jobs'
          gh run view "$FAILED_RUN_ID" --repo "${{ github.repository }}" --json status,workflowName \
            --jq '"\(.status) \(.workflowName)"' \
            | grep -Fx 'completed T3 B3 Frozen Real-world Parent Audit'

  score:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          name: t3-b3-realworld-parent-freeze-run${{ inputs.catalog_run_id }}
          run-id: ${{ inputs.catalog_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/realworld_catalog
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-discovery-${{ matrix.family }}-s*-n3000-run${{ inputs.discovery_run_id }}
          run-id: ${{ inputs.discovery_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/discovery_v3
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-discovery-${{ matrix.family }}-s*-n3000-run${{ inputs.discovery_retry_run_id }}
          run-id: ${{ inputs.discovery_retry_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/discovery_v3
          merge-multiple: true
      - name: Locate frozen parent manifest and verify all ten frozen weights
        id: frozen
        run: |
          manifest="$(find artifacts/realworld_catalog -type f -name frozen_parent_child_family_manifest.csv -print -quit)"
          test -n "$manifest"
          root="$(dirname "$(dirname "$manifest")")"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          for seed in {0..9}; do
            test -s "artifacts/discovery_v3/${{ matrix.family }}/seed$(printf '%02d' "$seed")/n3000/discovery.rds"
            test -s "artifacts/discovery_v3/${{ matrix.family }}/seed$(printf '%02d' "$seed")/n3000/stage_contract.rds"
          done
      - name: Score the assigned half of frozen Discovery seeds
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
          T3_REALWORLD_SOURCE_ROOT: ${{ steps.frozen.outputs.root }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_realworld_scoring.R \
            ${{ matrix.family }} ${{ matrix.seed }} 3000 "${{ steps.frozen.outputs.manifest }}" "${{ matrix.training_seeds }}"
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-realworld-retry-${{ matrix.family }}-s${{ matrix.seed }}-n3000-group${{ matrix.group }}-run${{ github.run_id }}
          path: artifacts/realworld_T3_B3/
          if-no-files-found: error
          retention-days: 90

  infer:
    needs: [plan, score]
    # This historical job downloads the full raw archive to one runner and
    # performs mean-only inference. The all-26 primary tournament now reduces
    # each immutable score artifact independently in t3-b3-pairwise-realworld.yml.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-realworld-*-run${{ inputs.failed_run_id }}
          run-id: ${{ inputs.failed_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/realworld_T3_B3
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-realworld-retry-*-run${{ github.run_id }}
          path: artifacts/realworld_T3_B3
          merge-multiple: true
      - name: Run complete parent-cluster inference, global BH-FDR, intervals, and taxonomy
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_realworld_parent_inference.R
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-realworld-global-inference-repaired-run${{ github.run_id }}
          path: artifacts/realworld_T3_B3/parent_inference_T3_B3
          if-no-files-found: error
          retention-days: 90
