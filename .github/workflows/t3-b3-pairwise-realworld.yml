name: T3 B3 Real-world global parent tournament and taxonomy
on:
  workflow_dispatch:
    inputs:
      reducer_run_ids:
        description: Comma-separated five successful Real-world reducer-batch run IDs
        required: true
        type: string
      benchmark_map_run_id:
        description: Frozen Discovery own-benchmark map run
        required: true
        default: '41478038812'
        type: string
      prepared_blocks_run_id:
        description: Run containing the frozen empirical-family proximity map
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          name: t3-b3-discovery-own-benchmark-map-run${{ inputs.benchmark_map_run_id }}
          run-id: ${{ inputs.benchmark_map_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/benchmark_map
      - uses: actions/download-artifact@v5
        with:
          name: t3-b3-realworld-block-plan-run${{ inputs.prepared_blocks_run_id }}
          run-id: ${{ inputs.prepared_blocks_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/family_map
      - name: Download and verify all five immutable reducer bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          REDUCER_RUN_IDS: ${{ inputs.reducer_run_ids }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          repo=os.environ['GH_REPOSITORY'];runs=[x.strip() for x in os.environ['REDUCER_RUN_IDS'].split(',') if x.strip()]
          if len(runs)!=5 or len(set(runs))!=5:raise SystemExit('Expected five unique reducer run IDs')
          for i,rid in enumerate(runs):
              view=json.loads(subprocess.check_output(['gh','run','view',rid,'--repo',repo,
                '--json','conclusion,workflowName'],text=True))
              if view.get('conclusion')!='success' or view.get('workflowName')!='T3 B3 Reduce complete Real-world tournament inputs':
                  raise SystemExit(f'Reducer run {rid} is not a successful Real-world reducer batch')
              name=f't3-b3-realworld-reduced-batch{i}-run{rid}'
              dest=Path(f'incoming/reducer_batch{i}');dest.mkdir(parents=True,exist_ok=True)
              subprocess.run(['gh','run','download',rid,'--repo',repo,'--name',name,'--dir',str(dest)],check=True)
              archives=list(dest.glob('*.tar.gz'))
              if len(archives)!=1:raise SystemExit(f'{name}: expected one archive, found {len(archives)}')
              subprocess.run(['bash','-lc',f'cd "{dest}" && sha256sum -c "{archives[0].name}.sha256"'],check=True)
              Path('artifacts/reduced').mkdir(parents=True,exist_ok=True)
              subprocess.run(['tar','-xzf',str(archives[0]),'-C','artifacts/reduced'],check=True)
          files=list(Path('artifacts/reduced').glob('*.csv.gz'))
          if len(files)!=856:raise SystemExit(f'Expected 856 parent-reduced score shards, found {len(files)}')
          if len({p.name for p in files})!=856:raise SystemExit('Duplicate reduced artifact filenames')
          print(f'REALWORLD_REDUCER_INPUT_COVERAGE_PASS {len(files)}/856')
          PY
      - name: Locate frozen maps and verify unique family labels
        id: maps
        run: |
          map="$(find artifacts/benchmark_map -type f -name own_benchmark_map.csv -print -quit)"
          family_map="$(find artifacts/family_map -type f -name empirical_family_proximity.csv -print -quit)"
          test -n "$map" -a -n "$family_map"
          python3 - "$family_map" <<'PY'
          import csv,sys
          rows=list(csv.DictReader(open(sys.argv[1],newline='')))
          fam={'normal','lognormal','weibull','invgauss','exgaussian','exwald'}
          if len(rows)!=743 or len({r['dataset_id'] for r in rows})!=743:
              raise SystemExit(f'Expected 743 unique classified child profiles, got {len(rows)}')
          if any(r['empirical_family_assignment'] not in fam for r in rows):
              raise SystemExit('Family map includes a non-family/unknown class')
          if any(not 0<=float(r['family_assignment_confidence'])<=1 for r in rows):
              raise SystemExit('Family assignment bootstrap stability is outside [0,1]')
          PY
          echo "benchmark_map=$map" >> "$GITHUB_OUTPUT"
          echo "family_map=$family_map" >> "$GITHUB_OUTPUT"
      - name: Run the global parent-cluster tournament, BH-FDR, intervals, and taxonomy
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_tournament_from_reduced.R \
            realworld artifacts/reduced '${{ steps.maps.outputs.benchmark_map }}' \
            '${{ steps.maps.outputs.family_map }}'
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-realworld-global-parent-tournament-run${{ github.run_id }}
          path: artifacts/v3_confirmatory_pairwise/realworld_v3
          if-no-files-found: error
          retention-days: 90
