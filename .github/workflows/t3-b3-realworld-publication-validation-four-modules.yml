      - uses: actions/upload-artifact@v4
        with:
          name: t3-rw-pub-validated-${{ matrix.family }}-${{ matrix.block }}-n${{ matrix.n }}-g0-run${{ github.run_id }}
          path: artifacts/rw_pub_validation/${{ matrix.family }}/${{ matrix.block }}_n${{ matrix.n }}
          if-no-files-found: error
          retention-days: 90


