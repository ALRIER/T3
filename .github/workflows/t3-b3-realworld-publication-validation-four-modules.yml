name: T3 B3 Real World — Frozen Optimization Controls, Split-Reference Targets, Parent Heterogeneity and Stability
run-name: "Real World controls + disjoint target sensitivity + parent heterogeneity + stability | 1260 two-seed checkpoint shards | max 22 overall"
"on":
  push:
    branches: [main]
    paths:
      - 'config/T3_B3_RW_SUPPLEMENTARY_CONTROLS_TARGETS_ONCE.txt'
permissions:
  contents: read
  actions: read
concurrency:
  group: t3-b3-realworld-frozen-controls-targets-full-20261107
  cancel-in-progress: true
env:
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      expected: ${{ steps.matrix.outputs.expected }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.10'}
      - name: Confirm completed original Real World, parent catalog and frozen Discovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,subprocess
          for rid in (40508641708,41487091262,41514871500,42251598557,42299685581):
           v=json.loads(subprocess.check_output(['gh','api',f'repos/${{ github.repository }}/actions/runs/{rid}'],text=True))
           if v['conclusion']!='success':raise ValueError('Frozen source run incomplete: '+str(rid))
          print('RW_PUBLICATION_FROZEN_SOURCES_PASS')
          PY
      - id: matrix
        name: Freeze exact complete six-family by fourteen-parent-block by three-n scoring matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,re,subprocess,collections,os
          repo=os.environ['GITHUB_REPOSITORY'];rid=41514871500
          artifacts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{rid}/artifacts?per_page=100'],text=True))['artifacts']
          pat=re.compile(r't3-b3-realworld-parentblock-(normal|lognormal|weibull|invgauss|exgaussian|exwald)-(b[0-9]{2})-run41514871500')
          blocks=[];seen=set();counts=collections.Counter()
          for a in artifacts:
           match=pat.fullmatch(a['name'])
           if not match:continue
           if a['expired']:raise ValueError('Expired frozen parent bundle')
           fam,block=match.groups()
           if (fam,block) in seen:raise ValueError('Duplicate immutable frozen block')
           seen.add((fam,block));counts[fam]+=1
           blocks.append(dict(family=fam,block=block,artifact=a['name']))
          if len(seen)!=84 or any(counts[f]!=14 for f in ('normal','lognormal','weibull','invgauss','exgaussian','exwald')):
           raise ValueError('Incomplete 84 independent source-family parent blocks '+repr(counts))
          matrix=[dict(**b,n=n) for b in sorted(blocks,key=lambda x:(x['family'],x['block'])) for n in (200,1000,3000)]
          if len(matrix)!=252:raise ValueError('The complete 252 scoring-job plan was truncated')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
           print('matrix='+json.dumps({'include':matrix},separators=(',',':')),file=out)
           print('expected=252',file=out)
          print('RW_PUBLICATION_252_SOURCE_BLOCK_SAMPLE_SIZE_MATRIX_PASS',flush=True)
          PY

  pilot-scoring-contract:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.10'}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore original parent source bundle with installation-limit-aware retries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/t3_b3_rw_artifact_retry.py --run 41514871500 --repo '${{ github.repository }}' --name t3-b3-realworld-parentblock-normal-b01-run41514871500 --dir incoming/parent
      - name: Restore n200 frozen Discovery without retraining
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/t3_b3_rw_artifact_retry.py --run 41487091262 --repo '${{ github.repository }}' --name t3-b3-discovery-bundle-n200-run41487091262 --dir incoming/discovery
      - name: Hash-check and unpack original immutable input bundles
        run: |
          set -euo pipefail
          mkdir -p input artifacts/discovery_v3
          archive="$(find incoming/parent -type f -name 'realworld-normal-b01.tar.gz' -print -quit)"
          checksum="$(find incoming/parent -type f -name 'realworld-normal-b01.tar.gz.sha256' -print -quit)"
          test -s "$archive" && test -s "$checksum"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$(head -1 "$checksum" | awk '{print $1}')"
          tar -xzf "$archive" -C input
          bundle="$(find incoming/discovery -name discovery-n200.tar.gz -print -quit)"
          checksum2="$(find incoming/discovery -name discovery-n200.tar.gz.sha256 -print -quit)"
          test -s "$bundle" && test -s "$checksum2"
          test "$(sha256sum "$bundle" | cut -d' ' -f1)" = "$(head -1 "$checksum2" | awk '{print $1}')"
          tar -xzf "$bundle" -C artifacts/discovery_v3
          test "$(find artifacts/discovery_v3/normal -type f -name discovery.rds | wc -l)" -eq 10
          test -s input/parent_block/parent_block_manifest.csv
      - name: Pilot exact scoring on one source block, n200, evaluation seed 30 only
        env:
          T3_REALWORLD_SOURCE_ROOT: input/parent_block
          T3_RW_PUBLICATION_EVAL_SEEDS: '30'
          T3_RW_PUBLICATION_PILOT_CHILD_LIMIT: '1'
          T3_REALWORLD_BLOCK_ID: b01
        run: |
          bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_realworld_publication_validation.R \
            normal b01 200 input/parent_block/parent_block_manifest.csv artifacts/discovery_v3
      - name: Gate pilot semantics and output hashes before launching complete scoring matrix
        run: |
          python - <<'PY'
          import json,gzip,csv,pathlib
          root=pathlib.Path('artifacts/rw_pub_validation/normal/b01_n200')
          m=json.loads((root/'validation_manifest.json').read_text())
          if m['evaluation_seeds'] not in ([30],30) or m['models_per_fit']!=7 or m['replications']!=500:raise ValueError('Pilot coverage')
          r=list(csv.DictReader(gzip.open(root/'replicate_sensitivity.csv.gz','rt')))
          if not r:raise ValueError('Pilot scoring file empty')
          expected_seeds=set(range(10))
          pairs={(int(x['training_seed']),x['model']) for x in r}
          if len(pairs)!=70 or {t for t,_ in pairs}!=expected_seeds:
           raise ValueError(f'Expected exactly 70 distinct (training_seed, model) pairs; got {len(pairs)}')
          common={x['model'] for x in r if x['model']=='mean'}
          if common!={'mean'}:raise ValueError('Missing shared arithmetic-mean baseline')
          for seed in expected_seeds:
           models={model for train,model in pairs if train==seed}
           if len(models)!=7 or sum('convex_mse' in x for x in models)!=1 or sum('local_deterministic' in x for x in models)!=1:
            raise ValueError(f'Missing one of seven models or non-evolutionary controls for training seed {seed}')
          if len({x['model'] for x in r})!=61:
           raise ValueError('Expected 61 model names: 1 common mean and 6 seed-specific models x 10')
          if {x['reference_policy'] for x in r}!={'holdout_half_mean','full_sample_mean'}:raise ValueError('Split-target gate missing')
          print('REALWORLD_PUBLICATION_PILOT_SEVEN_MODELS_TWO_REFERENCES_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: t3-rw-publication-pilot-one-seed-run${{ github.run_id }}
          path: artifacts/rw_pub_validation/normal/b01_n200
          if-no-files-found: error
          retention-days: 90

