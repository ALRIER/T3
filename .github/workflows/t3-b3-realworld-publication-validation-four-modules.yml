          tar -xzf "$bundle" -C artifacts/discovery_v3
          test "$(find artifacts/discovery_v3/${{ matrix.family }} -type f -name discovery.rds | wc -l)" -eq 10
          test -s input/parent_block/parent_block_manifest.csv
      - name: Score paired frozen estimators and split-reference targets for evaluation seeds 30-31 (of original 30-39)
