name: Package current T3 source
on:
  push:
    paths:
      - .github/workflows/package-t3-current.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Get pinned T3 revision
        run: |
          git clone --quiet https://github.com/ALRIER/T3.git /tmp/t3_source
          git -C /tmp/t3_source checkout --detach 396d7efaf0d0ef9932bdf622623708ce7cc5954b
          test "$(git -C /tmp/t3_source rev-parse HEAD)" = "396d7efaf0d0ef9932bdf622623708ce7cc5954b"
      - name: Assemble single-version audit archive
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, shutil, zipfile, hashlib, json, subprocess
          src=pathlib.Path('/tmp/t3_source')
          stage=pathlib.Path('/tmp/t3_audit_package')
          if stage.exists(): shutil.rmtree(stage)
          canonical=stage/'00_canonical_source'
          canonical.mkdir(parents=True)
          entries=subprocess.check_output(['git','-C',str(src),'ls-files','-z']).decode().split('\0')
          entries=[p for p in entries if p]
          shared=('R/00_shared/','config/','docker/')
          classes={
            '01_monte_carlo':('01_monte_carlo','montecarlo','monte_carlo','mc_'),
            '02_nested_tuning':('nested','optuna','hpo','cv_'),
            '03_discovery':('02_discovery','discovery','adaptive_stop','w_selection'),
            '04_held_out':('heldout','held_out'),
            '05_stress_and_transfer':('stress','transfer'),
            '06_real_world':('realworld','real_world','parent_child'),
            '07_inference_and_calibration':('inference','calibration','null_','false_positive','05_audits'),
            '08_synthesis':('aggregate','synthesis','report','panel'),
            '09_smoke_tests_and_integrity':('smoke','test','integrity','audit','preflight'),
            '10_supplementary_material':('docs/','readme','supplement'),
          }
          manifest=[]
          for name in entries:
            f=src/name
            if not f.is_file(): continue
            data=f.read_bytes()
            target=canonical/name
            target.parent.mkdir(parents=True,exist_ok=True)
            target.write_bytes(data)
            manifest.append({'path':name,'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
            low=name.lower()
            for section,terms in classes.items():
              if any(t in low for t in terms) or (name.startswith(shared) and section!='10_supplementary_material'):
                dest=stage/section/name
                dest.parent.mkdir(parents=True,exist_ok=True)
                dest.write_bytes(data)
          (stage/'SOURCE_MANIFEST.json').write_text(json.dumps({'repository':'ALRIER/T3','revision':'396d7efaf0d0ef9932bdf622623708ce7cc5954b','tracked_files':len(manifest),'files':manifest},indent=2))
          (stage/'README_FIRST.txt').write_text('Current T3 audit snapshot at commit 396d7efaf0d0ef9932bdf622623708ce7cc5954b. Run from 00_canonical_source for original relative paths. Other folders are grouped views of the SAME revision. This archive contains versioned source code, workflows, and repository tests; historical run artifacts and generated datasets are not included. GitHub Actions services and secrets may require local adaptation.\n')
          output=pathlib.Path('code updated/T3_current_audit_snapshot.zip')
          output.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED,compresslevel=8) as z:
            for file in sorted(stage.rglob('*')):
              if file.is_file():z.write(file,file.relative_to(stage))
          with zipfile.ZipFile(output) as z:
            assert z.testzip() is None
            assert len([n for n in z.namelist() if n.startswith('00_canonical_source/')])==len(manifest)
          print('Archive:',output,'Tracked source files:',len(manifest),'Bytes:',output.stat().st_size)
          PY
      - name: Commit audit archive to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "code updated/T3_current_audit_snapshot.zip"
          if ! git diff --cached --quiet; then
            git commit -m "Store current T3 stage-organized audit snapshot"
            git push origin HEAD:main
          fi
