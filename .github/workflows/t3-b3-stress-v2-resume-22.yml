          source=json.loads(pathlib.Path('incoming/lineage/rediscovery_resume_inventory.json').read_text())
          c=json.loads(next(pathlib.Path('incoming/confirm').rglob('global_manifest.json')).read_text())
          a=json.loads(next(pathlib.Path('incoming/adapt-final').rglob('global_manifest.json')).read_text())
