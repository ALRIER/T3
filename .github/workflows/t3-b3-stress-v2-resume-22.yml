          rows=list(csv.DictReader(reg.open(newline='')))
          assert len(rows)==720 and len({r['candidate_id'] for r in rows})==720
          assert len(source['old_successful_artifacts'])+len(source['remaining_jobs'])==180
          assert c['n_global_BH']==1382400 and a['n_global_BH']==2764800
          summary={'protocol':'T3_B3_STRESS_V2_FINAL_2RUN_RESCUE',
            'historical_stress_original_global_run':'42062234485',
            'superseded_failed_one_time_full_run':'42068731220',
            'superseded_queued_confirm_rescue':'42069857481',
            'this_recovery_run':'${{ github.run_id }}',
            'original_candidate_W':720,'adapted_candidate_W':720,
            'adapted_training_old_run_successfully_reused':source['old_success_count'],
            'adapted_training_rerun_new_run':source['retry_count'],
            'fresh_confirmation_seeds':list(range(50,60)),
            'adapted_training_seeds':list(range(60,70)),
            'historical_calibration_seeds':list(range(20,25)),
            'original_historical_confirmation_seeds':list(range(25,30)),
            'original_stress_hypotheses':1382400,
            'adapted_plus_original_hypotheses':2764800,
            'global_alpha':0.05,
            'scientific_comparison':'Original 720 W and near-adapted 720 W share fresh independent 50–59 MC; far mechanism excluded from adapted training',
            'artifact_prefixes':['stress-v2-confirm-','stress-v2-resumed-adapt-','stress-v2-resumed-confirm-','stress-v2-resumed-adapted-']}
          (out/'final_lineage.json').write_text(json.dumps(summary,indent=2)+'\n')
          (out/'CODEX_IMPORT_README.md').write_text(
            '# T3/B3 Stress V2 final results\n'
            'Never concatenate candidates into seed-averaged engine names. Preserve '
