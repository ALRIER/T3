            'Historical Stress inference: run 42062234485 (20–24 classic calibration, 25–29 test).\n'
            'Adapted training source: old run 42068731220 plus resumed run ${{ github.run_id }} '
            '(use merge_provenance.json for exact model-by-model source).\n'
            'Fresh original confirmation and adapted comparison: resumed run ${{ github.run_id }}, '
            'with test seeds 50–59; both score the exact same MC samples.\n'
            'Treat original and adapted cohorts as separate frozen candidate identities. '
            'Do not discard per-seed score files, original MC RDS, training manifests or hashes.\n'
            'The new near mechanism is seen during adapted training, not a strict OOD evaluation; '
            'far remains mechanism-out-of-distribution.\n')
          print('STRESS_V2_CROSSRUN_FINAL_HANDOFF_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stress-v2-resumed-final-provenance-run${{ github.run_id }}
