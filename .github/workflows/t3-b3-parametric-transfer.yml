name: T3 B3 Frozen Parametric Transfer
on:
  workflow_dispatch:
    inputs:
      discovery_bundle_run_id:
        description: Successful Actions run packaging all immutable Discovery shards
        required: true
        default: '41487091262'
        type: string
      benchmark_map_run_id:
        description: Successful Discovery-only own-benchmark map run
        required: true
        default: '41478038812'
        type: string
      batch_index:
        description: Zero-based shard batch (10 bounded batches total)
        required: true
        default: '0'
        type: string
      batch_count:
        description: Number of deterministic shard batches
        required: true
        default: '10'
        type: string
      scenario_block_index:
        description: Immutable scenario checkpoint (dispatch 0 through 7 for every shard batch)
        required: true
        type: choice
        options: ['0','1','2','3','4','5','6','7']
      prepared_inputs_run_id:
        description: Existing run with successful benchmark-map and Discovery-input preparation; blank prepares them in this run
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      expected_shards: ${{ steps.plan.outputs.expected_shards }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          BATCH_INDEX: ${{ inputs.batch_index }}
          BATCH_COUNT: ${{ inputs.batch_count }}
          SCENARIO_BLOCK_INDEX: ${{ inputs.scenario_block_index }}
        run: |
          plan_json="$(python3 scripts/t3_b3_parametric_transfer_plan.py "$BATCH_INDEX" "$BATCH_COUNT" "$SCENARIO_BLOCK_INDEX" 8)"
          matrix="$(python3 -c 'import json,sys; print(json.dumps({"include":json.load(sys.stdin)["include"]},separators=(",",":")))' <<< "$plan_json")"
          expected="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["expected_shards"])' <<< "$plan_json")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "expected_shards=$expected" >> "$GITHUB_OUTPUT"

  prepare_benchmark_map:
    if: ${{ inputs.prepared_inputs_run_id == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen Discovery benchmark-map source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.benchmark_map_run_id }}
        run: |
          gh run view "$RUN_ID" --repo "${{ github.repository }}" --json conclusion,workflowName \
            --jq '"\(.conclusion) \(.workflowName)"' \
            | grep -Fx 'success T3 B3 Discovery own-benchmark freeze'
      - uses: actions/download-artifact@v5
        with:
          name: t3-b3-discovery-own-benchmark-map-run${{ inputs.benchmark_map_run_id }}
          run-id: ${{ inputs.benchmark_map_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/benchmark
      - name: Verify and retain the immutable benchmark map for this run
        run: |
          map="$(find incoming/benchmark -name own_benchmark_map.csv -print -quit)"
          test -s "$map"
          mkdir -p artifacts/benchmark_map
          cp "$map" artifacts/benchmark_map/own_benchmark_map.csv
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-parametric-benchmark-map-run${{ github.run_id }}
          path: artifacts/benchmark_map/own_benchmark_map.csv
          if-no-files-found: error
          retention-days: 90

  prepare_discovery_inputs:
    needs: [prepare_benchmark_map]
    if: ${{ always() && inputs.prepared_inputs_run_id == '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {family: normal, n: 200}
          - {family: normal, n: 1000}
          - {family: normal, n: 3000}
          - {family: lognormal, n: 200}
          - {family: lognormal, n: 1000}
          - {family: lognormal, n: 3000}
          - {family: weibull, n: 200}
          - {family: weibull, n: 1000}
          - {family: weibull, n: 3000}
          - {family: invgauss, n: 200}
          - {family: invgauss, n: 1000}
          - {family: invgauss, n: 3000}
          - {family: exgaussian, n: 200}
          - {family: exgaussian, n: 1000}
          - {family: exgaussian, n: 3000}
          - {family: exwald, n: 200}
          - {family: exwald, n: 1000}
          - {family: exwald, n: 3000}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the packaged immutable Discovery source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.discovery_bundle_run_id }}
        run: |
          gh run view "$RUN_ID" --repo "${{ github.repository }}" --json conclusion,workflowName \
            --jq '"\(.conclusion) \(.workflowName)"' \
            | grep -Fx 'success T3 B3 Package immutable Discovery shards'
      - uses: actions/download-artifact@v5
        with:
          name: t3-b3-discovery-bundle-n${{ matrix.n }}-run${{ inputs.discovery_bundle_run_id }}
          run-id: ${{ inputs.discovery_bundle_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/discovery
      - uses: actions/download-artifact@v5
        with:
          name: t3-b3-parametric-benchmark-map-run${{ github.run_id }}
          path: incoming/benchmark
      - name: Verify and create the family-specific Discovery input bundle
        run: |
          cd incoming/discovery
          sha256sum -c discovery-n${{ matrix.n }}.tar.gz.sha256
          mkdir -p "$GITHUB_WORKSPACE/artifacts/discovery_v3"
          tar -xzf discovery-n${{ matrix.n }}.tar.gz -C "$GITHUB_WORKSPACE/artifacts/discovery_v3"
          cd "$GITHUB_WORKSPACE"
          test "$(find artifacts/discovery_v3 -name discovery.rds -type f | wc -l)" -eq 60
          map="$(find incoming/benchmark -name own_benchmark_map.csv -print -quit)"
          test -s "$map"
          python3 - "$map" '${{ matrix.family }}' '${{ matrix.n }}' <<'PY'
          import csv,sys
          rows=list(csv.DictReader(open(sys.argv[1],newline='')))
          fam,n=sys.argv[2],int(sys.argv[3])
          rows=[r for r in rows if r['evaluation_family']==fam and int(r['sample_n'])==n]
          grid=list(csv.DictReader(open('config/T2_V3_B3_prospective_321_grid.csv',newline='')))
          expected={r['scenario_id'] for r in grid if r['mechanism'] not in
                    {'mixture_bimodal_near','mixture_bimodal_far'}}
          actual={r['scenario_id'] for r in rows}
          if len(expected)!=241 or actual!=expected or len(rows)!=241:
              raise SystemExit(f'Expected the 241 Discovery-support benchmark cells for {fam}/n={n}, found {len(rows)}')
          out='artifacts/discovery_v3/own_benchmark_map.csv'
          with open(out,'w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys());w.writeheader();w.writerows(rows)
          PY
          mkdir -p artifacts/parametric_input
          cp -a "artifacts/discovery_v3/${{ matrix.family }}" artifacts/parametric_input/
          cp artifacts/discovery_v3/own_benchmark_map.csv artifacts/parametric_input/
          test "$(find artifacts/parametric_input/${{ matrix.family }} -name discovery.rds -type f | wc -l)" -eq 10
          tar -czf "artifacts/parametric_input/discovery-${{ matrix.family }}-n${{ matrix.n }}.tar.gz" \
            -C artifacts/parametric_input "${{ matrix.family }}" own_benchmark_map.csv
          cd artifacts/parametric_input
          sha256sum "discovery-${{ matrix.family }}-n${{ matrix.n }}.tar.gz" \
            > "discovery-${{ matrix.family }}-n${{ matrix.n }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-parametric-input-${{ matrix.family }}-n${{ matrix.n }}-run${{ github.run_id }}
          path: artifacts/parametric_input/discovery-${{ matrix.family }}-n${{ matrix.n }}.tar.gz*
          if-no-files-found: error
          retention-days: 90

  prep_gate:
    needs: [prepare_benchmark_map,prepare_discovery_inputs]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify shared Discovery inputs or this run's preparation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PREPARED_RUN_ID: ${{ inputs.prepared_inputs_run_id }}
          MAP_RESULT: ${{ needs.prepare_benchmark_map.result }}
          INPUT_RESULT: ${{ needs.prepare_discovery_inputs.result }}
        run: |
          if [[ -z "$PREPARED_RUN_ID" ]]; then
            test "$MAP_RESULT" = success
            test "$INPUT_RESULT" = success
            exit 0
          fi
          python3 - <<'PY'
          import json,os,subprocess
          run=os.environ['PREPARED_RUN_ID'];repo=os.environ['REPOSITORY']
          jobs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/jobs?per_page=100'],text=True))['jobs']
          bm=[j for j in jobs if j['name']=='prepare_benchmark_map']
          di=[j for j in jobs if j['name'].startswith('prepare_discovery_inputs (')]
          if len(bm)!=1 or bm[0]['conclusion']!='success' or len(di)!=18 or any(j['conclusion']!='success' for j in di):
              raise SystemExit('Prepared source run lacks all 18 successful input bundles')
          arts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts?per_page=100'],text=True))['artifacts']
          names=[a['name'] for a in arts if not a.get('expired')]
          if f't3-b3-parametric-benchmark-map-run{run}' not in names:
              raise SystemExit('Prepared source run lacks frozen benchmark-map artifact')
          expected={f't3-b3-parametric-input-{f}-n{n}-run{run}' for f in
              ('normal','lognormal','weibull','invgauss','exgaussian','exwald') for n in (200,1000,3000)}
          if not expected.issubset(set(names)):
              raise SystemExit('Prepared source run lacks one or more family/n bundles')
          print('SHARED_DISCOVERY_INPUTS_READY',run)
          PY

  transfer:
    needs: [plan,prep_gate]
    if: ${{ always() && needs.plan.result == 'success' && needs.prep_gate.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          name: t3-b3-parametric-input-${{ matrix.family }}-n${{ matrix.n }}-run${{ inputs.prepared_inputs_run_id != '' && inputs.prepared_inputs_run_id || github.run_id }}
          run-id: ${{ inputs.prepared_inputs_run_id != '' && inputs.prepared_inputs_run_id || github.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/parametric_input
      - name: Verify the family-specific frozen Discovery bundle
        run: |
          cd incoming/parametric_input
          archive="discovery-${{ matrix.family }}-n${{ matrix.n }}.tar.gz"
          sha256sum -c "$archive.sha256"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/discovery_v3"
          tar -xzf "$archive" -C "$GITHUB_WORKSPACE/artifacts/discovery_v3"
          cd "$GITHUB_WORKSPACE"
          test "$(find "artifacts/discovery_v3/${{ matrix.family }}" -name discovery.rds -type f | wc -l)" -eq 10
          test -s artifacts/discovery_v3/own_benchmark_map.csv
      - name: Generate the independent parameter-row Monte Carlo shard
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
          T3_TRANSFER_SCENARIO_BLOCK: ${{ matrix.scenario_block }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_parametric_transfer_mc.R \
            '${{ matrix.family }}' '${{ matrix.parameter_row }}' '${{ matrix.seed }}' 500 '${{ matrix.n }}' '${{ matrix.scenario_ids }}'
      - name: Score against the Discovery-frozen own benchmark and mean
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          mc="artifacts/t3_b3_parametric_transfer_mc/${{ matrix.family }}/parameter_row$(printf '%02d' ${{ matrix.parameter_row }})/seed$(printf '%02d' ${{ matrix.seed }})/n${{ matrix.n }}_r500/canonical.rds"
          mc="${mc%/canonical.rds}/b${{ matrix.scenario_block }}/canonical.rds"
          test -s "$mc"
          bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_parametric_transfer_score.R \
            '${{ matrix.family }}' '${{ matrix.parameter_row }}' '${{ matrix.seed }}' '${{ matrix.n }}' \
            "$mc" artifacts/discovery_v3 artifacts/discovery_v3/own_benchmark_map.csv
      - name: Verify this shard's Monte Carlo and score hashes
        run: |
          python3 - <<'PY'
          import csv,hashlib
          from pathlib import Path
          mc=Path('artifacts/t3_b3_parametric_transfer_mc/${{ matrix.family }}/parameter_row${{ matrix.parameter_row }}/seed${{ matrix.seed }}/n${{ matrix.n }}_r500/b${{ matrix.scenario_block }}/canonical.rds')
          mm=mc.with_name('manifest.csv')
          score=Path('artifacts/t3_b3_parametric_transfer/${{ matrix.family }}/parameter_row${{ matrix.parameter_row }}/seed${{ matrix.seed }}_n${{ matrix.n }}/b${{ matrix.scenario_block }}/scores.csv')
          sm=score.with_name('score_manifest.csv')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          m=list(csv.DictReader(mm.open()));s=list(csv.DictReader(sm.open()))
          if len(m)!=1 or len(s)!=1 or sha(mc)!=m[0]['sha256'] or sha(score)!=s[0]['scores_sha256'] or s[0]['mc_sha256']!=m[0]['sha256']:
              raise SystemExit('Parametric shard checksum contract failed')
          print('PARAMETRIC_SHARD_CHECKSUM_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-parametric-mc-${{ matrix.family }}-p${{ matrix.parameter_row }}-s${{ matrix.seed }}-n${{ matrix.n }}-b${{ matrix.scenario_block }}-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: artifacts/t3_b3_parametric_transfer_mc/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-parametric-score-${{ matrix.family }}-p${{ matrix.parameter_row }}-s${{ matrix.seed }}-n${{ matrix.n }}-b${{ matrix.scenario_block }}-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: artifacts/t3_b3_parametric_transfer/
          if-no-files-found: error
          retention-days: 90

  verify_batch_coverage:
    needs: [plan,transfer]
    if: ${{ always() && needs.plan.result == 'success' && needs.transfer.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-parametric-score-*-run${{ github.run_id }}-a*
          path: incoming/score_shards
          merge-multiple: true
      - name: Verify exact expected shard and manifest coverage
        run: |
          python3 scripts/t3_b3_parametric_transfer_coverage.py \
            incoming/score_shards '${{ inputs.batch_index }}' '${{ inputs.batch_count }}' \
            '${{ needs.plan.outputs.expected_shards }}' '${{ inputs.scenario_block_index }}'
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-parametric-batch-coverage-${{ inputs.batch_index }}-b${{ inputs.scenario_block_index }}-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: incoming/score_shards/parametric_batch_coverage.csv
          if-no-files-found: error
          retention-days: 90
