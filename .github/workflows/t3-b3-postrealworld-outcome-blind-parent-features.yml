name: T3 B3 — Frozen Parent Regime Features and Source-Domain Export
run-name: "Export outcome-blind regime descriptors from 84 original Real World parent blocks"
"on":
  push:
    branches: [main]
    paths:
      - config/T3_B3_POST_RW_OUTCOME_BLIND_PARENT_FEATURES_ONCE.txt
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: t3-b3-post-rw-outcome-blind-profile-export
  cancel-in-progress: false
env:
  T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
  PYTHONUNBUFFERED: '1'
jobs:
  pilot-outcome-blind-source-hash-and-feature-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.10'}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download one original parent sample, verify both source hashes and compute pilot parent features
        env:
          GH_TOKEN: ${{ github.token }}
          T3_REALWORLD_SOURCE_ROOT: input/parent_block
        run: |
          set -euo pipefail
          python scripts/t3_b3_rw_artifact_retry.py --run 41514871500 \
            --repo '${{ github.repository }}' \
            --name 't3-b3-realworld-parentblock-normal-b01-run41514871500' \
            --dir incoming/parent
          mkdir -p input
          archive="$(find incoming/parent -name realworld-normal-b01.tar.gz -print -quit)"
          checksum="$(find incoming/parent -name realworld-normal-b01.tar.gz.sha256 -print -quit)"
          test -s "$archive" && test -s "$checksum"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$(head -1 "$checksum" | awk '{print $1}')"
          tar -xzf "$archive" -C input
          bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_export_outcome_blind_parent_features.R \
            normal b01 input/parent_block/parent_block_manifest.csv \
            artifacts/profile_pilot/normal_b01_profiles.csv
          python - <<'PY'
          import csv
          rows=list(csv.DictReader(open('artifacts/profile_pilot/normal_b01_profiles.csv',newline='')))
          assert rows and len(rows)%3==0, 'Pilot must emit all three sample size policies per parent'
          assert {'parent_dataset_id','source_family','sample_n','data_source',
           'profile_fit_confidence','skewness','kurtosis','tail_ratio'}<=set(rows[0])
          assert {int(r['sample_n']) for r in rows}=={200,1000,3000}
          print('T3_B3_OUTCOME_BLIND_PARENT_PROFILE_PILOT_PASS',len(rows))
          PY
  export-outcome-blind-parent-block-features:
    needs: pilot-outcome-blind-source-hash-and-feature-schema
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        family: [normal,lognormal,weibull,invgauss,exgaussian,exwald]
        block: [b01,b02,b03,b04,b05,b06,b07,b08,b09,b10,b11,b12,b13,b14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.10'}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore immutable parent sample with bounded installation-API retries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/t3_b3_rw_artifact_retry.py --run 41514871500 \
            --repo '${{ github.repository }}' \
            --name 't3-b3-realworld-parentblock-${{ matrix.family }}-${{ matrix.block }}-run41514871500' \
            --dir incoming/parent
      - name: Hash-check and unpack public source vectors
        run: |
          set -euo pipefail
          mkdir -p input
          archive="$(find incoming/parent -name 'realworld-${{ matrix.family }}-${{ matrix.block }}.tar.gz' -print -quit)"
          checksum="$(find incoming/parent -name 'realworld-${{ matrix.family }}-${{ matrix.block }}.tar.gz.sha256' -print -quit)"
          test -s "$archive" && test -s "$checksum"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$(head -1 "$checksum" | awk '{print $1}')"
          tar -xzf "$archive" -C input
          test -s input/parent_block/parent_block_manifest.csv
      - name: Export source-only parent descriptors for all sample-size policies
        env:
          T3_REALWORLD_SOURCE_ROOT: input/parent_block
        run: |
          bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_export_outcome_blind_parent_features.R \
            '${{ matrix.family }}' '${{ matrix.block }}' \
            input/parent_block/parent_block_manifest.csv \
            artifacts/post_rw_parent_profiles/profiles_${{ matrix.family }}_${{ matrix.block }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-post-rw-parent-profiles-${{ matrix.family }}-${{ matrix.block }}-run${{ github.run_id }}
          path: artifacts/post_rw_parent_profiles/
          if-no-files-found: error
          retention-days: 90

  verify-independent-642-parent-feature-coverage:
    needs: export-outcome-blind-parent-block-features
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.10'}
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-post-rw-parent-profiles-*-run${{ github.run_id }}
          path: incoming/parent_profiles
          merge-multiple: true
      - name: Freeze exactly 84 blocks, three n policies and independent parent keys
        run: |
          python - <<'PY'
          import csv,hashlib,json,pathlib
          root=pathlib.Path('incoming/parent_profiles')
          paths=sorted(root.rglob('profiles_*.csv'))
          if len(paths)!=84:raise ValueError(f'Expected 84 independently checked parent bundles, got {len(paths)}')
          rows=[];seen=set();blocks=set()
          for p in paths:
           with p.open(newline='') as f:r=list(csv.DictReader(f))
           if not r:raise ValueError('Empty frozen parent source block')
           for x in r:
            key=(x['parent_dataset_id'],x['sample_n'])
            if key in seen:raise ValueError('Parent appears in multiple source blocks or is duplicated')
            seen.add(key)
            blocks.add((x['source_family'],x['original_parent_block_id']))
            rows.append(x)
          expected={(f,f'b{b:02d}') for f in ('normal','lognormal','weibull','invgauss','exgaussian','exwald') for b in range(1,15)}
          if blocks!=expected:raise ValueError('Incomplete 84 frozen original parent blocks')
          parents={x['parent_dataset_id'] for x in rows}
          if len(parents)!=642 or len(rows)!=642*3:raise ValueError(
            f'External independent parent coverage incorrect: parents={len(parents)} sample_policy_rows={len(rows)}')
          out=pathlib.Path('artifacts/post_rw_parent_features');out.mkdir(parents=True,exist_ok=True)
          csvfile=out/'outcome_blind_parent_features.csv'
          with csvfile.open('w',newline='') as f:
           writer=csv.DictWriter(f,fieldnames=list(rows[0]));writer.writeheader();writer.writerows(rows)
          (out/'frozen_parent_features_provenance.json').write_text(json.dumps(dict(
           frozen_parent_block_run=41514871500,independent_parents=len(parents),sample_n=[200,1000,3000],
           original_parent_blocks=84,original_parent_features_sha256=hashlib.sha256(csvfile.read_bytes()).hexdigest(),
           outcome_blind=True,uses_realworld_estimator_scores=False,fit_to_realworld_validation_outcomes=False),indent=2)+'\n')
          print('POST_RW_642_FROZEN_INDEPENDENT_PARENT_FEATURES_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-rw-parent-outcome-blind-features-run${{ github.run_id }}
          path: artifacts/post_rw_parent_features
          if-no-files-found: error
          retention-days: 90
