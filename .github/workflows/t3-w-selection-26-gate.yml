name: T3 Frozen W Selection and 26 Benchmarks Gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t3-w-selection-26-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/run_r_in_container.sh Rscript scripts/t3_common_w_selection_smoke.R
