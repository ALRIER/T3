name: T3 Common Sample Size Contract — Stage Scripts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/t3-common-sample-sizes.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  sizes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/run_r_in_container.sh Rscript scripts/t3_common_n_contract_smoke.R
