name: T3 B3 Azure Persistence Contract (manual)
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Immutable experiment namespace
        required: true
        default: b3-persistence-smoke-v1
permissions:
  contents: read
  id-token: write
jobs:
  azure-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: b3-persistence
    steps:
      - uses: actions/checkout@v4
      - name: Azure OIDC sign in
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read storage configuration from Key Vault without exposing secrets
        shell: bash
        env:
          B3_KEY_VAULT: ${{ vars.B3_KEY_VAULT }}
        run: |
          set -euo pipefail
          test -n "$B3_KEY_VAULT"
          echo "B3_AZURE_STORAGE_ACCOUNT=$(az keyvault secret show --vault-name "$B3_KEY_VAULT" --name B3-Storage-Account --query value -o tsv)" >> "$GITHUB_ENV"
          echo "B3_AZURE_CONTAINER=$(az keyvault secret show --vault-name "$B3_KEY_VAULT" --name B3-Storage-Container --query value -o tsv)" >> "$GITHUB_ENV"
      - name: Verify isolated stage fixture roundtrip (no scientific work)
        shell: bash
        env:
          EXPERIMENT: ${{ inputs.experiment }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b3-fixture"
          printf 'b3 contract fixture %s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/b3-fixture/fixture.txt"
          python3 scripts/t3_b3_azure_artifacts.py upload --experiment "${EXPERIMENT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --stage discovery --family normal --seed 0 --n 200 --directory "$RUNNER_TEMP/b3-fixture" | tee "$RUNNER_TEMP/published.json"
          SHA=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["sha256"])' "$RUNNER_TEMP/published.json")
          python3 scripts/t3_b3_azure_artifacts.py download --experiment "${EXPERIMENT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --stage discovery --family normal --seed 0 --n 200 --sha256 "$SHA" --directory "$RUNNER_TEMP/b3-retrieved"
          cmp "$RUNNER_TEMP/b3-fixture/fixture.txt" "$RUNNER_TEMP/b3-retrieved/fixture.txt"
          echo 'B3_AZURE_KEYVAULT_OIDC_UPLOAD_DOWNLOAD_SHA256_PASS'
