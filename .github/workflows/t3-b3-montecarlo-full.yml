    steps:
      - uses: actions/checkout@v4
      - name: Generate B3 prospective 321 design
        run: python3 scripts/t2_v3_b3_generate_grid321.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull pinned scientific R runtime
        run: docker pull ghcr.io/alrier/t3-r:4.3.3-statmod-v2
      - name: Monte Carlo full 500 replications per scenario
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r:4.3.3-statmod-v2
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_montecarlo_full.R ${{ matrix.family }} stress ${{ matrix.seed }} 500 ${{ matrix.n }}
      - name: Persist completed canonical or partial checkpoint for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b3-mc-stress-${{ matrix.family }}-s${{ matrix.seed }}-n${{ matrix.n }}-run${{ github.run_id }}
          path: artifacts/mc_t3_grid321/t3_b3_grid321_v1/stress/${{ matrix.family }}/seed*/n*_r500/
          retention-days: 30
          if-no-files-found: warn

