name: T3 B3 Package immutable Discovery shards
on:
  workflow_dispatch:
    inputs:
      discovery_run_id:
        description: Primary successful Discovery run
        required: true
        default: '41113724413'
        type: string
      discovery_retry_run_id:
        description: Successful Discovery repair run with remaining shards
        required: true
        default: '41207646731'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-discovery-*-s*-n*-run${{ inputs.discovery_run_id }}
          run-id: ${{ inputs.discovery_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/discovery_v3
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-discovery-*-s*-n*-run${{ inputs.discovery_retry_run_id }}
          run-id: ${{ inputs.discovery_retry_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/discovery_v3
          merge-multiple: true
      - name: Verify and package the complete immutable Discovery registry
        run: |
          test "$(find artifacts/discovery_v3 -name discovery.rds -type f | wc -l)" -eq 180
          test "$(find artifacts/discovery_v3 -name stage_contract.rds -type f | wc -l)" -eq 180
          mkdir -p artifacts/bundle_stage artifacts/discovery_bundles
          for n in 200 1000 3000; do
            for family in normal lognormal weibull invgauss exgaussian exwald; do
              for i in $(seq 0 9); do
                printf -v seed '%02d' "$i"
                src="artifacts/discovery_v3/$family/seed$seed/n$n"
                dst="artifacts/bundle_stage/n$n/$family/seed$seed/n$n"
                test -s "$src/discovery.rds"
                test -s "$src/stage_contract.rds"
                mkdir -p "$dst"
                for file in discovery.rds stage_contract.rds frozen_hyperparameters.json frozen_w_registry.csv manifest.csv computational_budget_ledger.csv scenario_partition.csv discovery_scope.txt; do
                  test -s "$src/$file"
                  cp "$src/$file" "$dst/$file"
                done
              done
            done
            printf 'discovery_run_id=%s\ndiscovery_retry_run_id=%s\nbundle_run_id=%s\nsample_n=%s\nshards=60\n' \
              '${{ inputs.discovery_run_id }}' '${{ inputs.discovery_retry_run_id }}' '${{ github.run_id }}' "$n" \
              > "artifacts/bundle_stage/n$n/source_provenance.txt"
            find "artifacts/bundle_stage/n$n" -type f -print | sort > "artifacts/bundle_stage/files-n$n.txt"
            tar -czf "$GITHUB_WORKSPACE/artifacts/discovery_bundles/discovery-n$n.tar.gz" \
              -C "$GITHUB_WORKSPACE/artifacts/bundle_stage/n$n" .
            sha256sum "artifacts/discovery_bundles/discovery-n$n.tar.gz" \
              > "artifacts/discovery_bundles/discovery-n$n.tar.gz.sha256"
            tar -tzf "artifacts/discovery_bundles/discovery-n$n.tar.gz" | grep -c '/discovery.rds$' | grep -qx 60
          done
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-discovery-bundle-n200-run${{ github.run_id }}
          path: artifacts/discovery_bundles/discovery-n200.tar.gz*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-discovery-bundle-n1000-run${{ github.run_id }}
          path: artifacts/discovery_bundles/discovery-n1000.tar.gz*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-discovery-bundle-n3000-run${{ github.run_id }}
          path: artifacts/discovery_bundles/discovery-n3000.tar.gz*
          if-no-files-found: error
          retention-days: 90
