name: T3 B3 Package immutable Discovery shards
on:
  workflow_dispatch:
    inputs:
      discovery_run_id:
        description: Primary successful Discovery run
        required: true
        default: '41113724413'
        type: string
      discovery_retry_run_id:
        description: Successful repair run with remaining Discovery shards
        required: true
        default: '41207646731'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-discovery-*-s*-n*-run${{ inputs.discovery_run_id }}
          run-id: ${{ inputs.discovery_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/discovery_v3
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          pattern: t3-b3-discovery-*-s*-n*-run${{ inputs.discovery_retry_run_id }}
          run-id: ${{ inputs.discovery_retry_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/discovery_v3
          merge-multiple: true
      - name: Verify and compress the complete immutable shard panel
        run: |
          test "$(find artifacts/discovery_v3 -name discovery.rds -type f | wc -l)" -eq 180
          test "$(find artifacts/discovery_v3 -name stage_contract.rds -type f | wc -l)" -eq 180
          mkdir -p artifacts/discovery_bundles
          for n in 200 1000 3000; do
            for f in normal lognormal weibull invgauss exgaussian exwald; do
              for i in $(seq 0 9); do
                printf -v s '%02d' "$i"
                test -s "artifacts/discovery_v3/$f/seed$s/n$n/discovery.rds"
                test -s "artifacts/discovery_v3/$f/seed$s/n$n/stage_contract.rds"
              done
            done
            find "artifacts/discovery_v3" -type f -path "*/seed*/n$n/*" \
              | sed 's#^artifacts/discovery_v3/##' > "artifacts/discovery_bundles/files-n$n.txt"
            test "$(wc -l < "artifacts/discovery_bundles/files-n$n.txt")" -gt 0
            tar -czf "artifacts/discovery_bundles/discovery-n$n.tar.gz" \
              -C artifacts/discovery_v3 -T "artifacts/discovery_bundles/files-n$n.txt"
            sha256sum "artifacts/discovery_bundles/discovery-n$n.tar.gz" \
              > "artifacts/discovery_bundles/discovery-n$n.tar.gz.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-discovery-bundle-n200-run${{ github.run_id }}
          path: artifacts/discovery_bundles/discovery-n200.tar.gz*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-discovery-bundle-n1000-run${{ github.run_id }}
          path: artifacts/discovery_bundles/discovery-n1000.tar.gz*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-discovery-bundle-n3000-run${{ github.run_id }}
          path: artifacts/discovery_bundles/discovery-n3000.tar.gz*
          if-no-files-found: error
          retention-days: 90
