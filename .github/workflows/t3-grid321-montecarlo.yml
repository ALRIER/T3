name: T3 321-Scenario Monte Carlo Production
on:
  workflow_dispatch:
    inputs:
      role:
        description: 'Independent stage to generate'
        required: true
        type: choice
        options: [discovery, heldout, stress]
permissions:
  contents: read
  packages: read
concurrency:
  group: t3-mc-${{ inputs.role }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: bash
        env:
          ROLE: ${{ inputs.role }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          role=os.environ['ROLE']
          seeds={'discovery':range(10),'heldout':range(10,15),'stress':range(15,20)}[role]
          z=[dict(family=f,seed=s,n=n) for f in ['normal','lognormal','weibull','invgauss','exgaussian','exwald'] for s in seeds for n in [200,1000,3000]]
          print('matrix='+json.dumps({'include':z},separators=(',',':')))
          PY
  simulate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate 321-condition manifest
        run: |
          python3 scripts/t2_v3_b3_generate_grid321.py
          git diff --exit-code -- config/T2_V3_B3_prospective_321_grid.csv
      - name: Generate independent Monte Carlo shard
        env:
          T2_V3_REPS: '500'
          T2_V3_SCENARIOS: '320'
        run: bash scripts/run_r_in_container.sh Rscript scripts/v3_montecarlo_stage.R "${{ inputs.role }}" "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.n }}"
      - uses: actions/upload-artifact@v4
        with:
          name: t3-grid321-${{ inputs.role }}-${{ matrix.family }}-seed${{ matrix.seed }}-n${{ matrix.n }}
          path: artifacts/mc_t3_grid321/
          retention-days: 90
          if-no-files-found: error
