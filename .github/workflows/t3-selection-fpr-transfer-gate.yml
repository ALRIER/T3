name: T3 Selection-Aware FPR and Transfer Gate
on:
  workflow_dispatch:
  push:
    paths:
      - 'R/05_validation/t3_selection_aware_validation.R'
      - 'tests/test_t3_selection_aware_transfer.R'
      - '.github/workflows/t3-selection-fpr-transfer-gate.yml'
jobs:
  scientific-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
      - name: Check selection replay and transfer isolation
        run: Rscript tests/test_t3_selection_aware_transfer.R
