name: T3 B3 Downstream end-to-end smoke from completed Monte Carlo
"on":
  workflow_dispatch:
    inputs:
      mc_run_id:
        description: Successful completed T3 B3 Monte Carlo run ID (no regeneration)
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the source Monte Carlo run succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run view ${{ inputs.mc_run_id }} --repo ${{ github.repository }} --json conclusion,workflowName --jq 'select(.conclusion=="success" and .workflowName=="T3 B3 FULL Monte Carlo 321 x 500")'
      - uses: actions/download-artifact@v5
        with:
          name: b3-mc-discovery-normal-s0-n200-run${{ inputs.mc_run_id }}
          run-id: ${{ inputs.mc_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/e2e_mc/b3-mc-discovery-normal-s0-n200-run${{ inputs.mc_run_id }}
      - uses: actions/download-artifact@v5
        with:
          name: b3-mc-discovery-lognormal-s0-n200-run${{ inputs.mc_run_id }}
          run-id: ${{ inputs.mc_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/e2e_mc/b3-mc-discovery-lognormal-s0-n200-run${{ inputs.mc_run_id }}
      - uses: actions/download-artifact@v5
        with:
          name: b3-mc-heldout-normal-s10-n200-run${{ inputs.mc_run_id }}
          run-id: ${{ inputs.mc_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/e2e_mc/b3-mc-heldout-normal-s10-n200-run${{ inputs.mc_run_id }}
      - uses: actions/download-artifact@v5
        with:
          name: b3-mc-heldout-normal-s11-n200-run${{ inputs.mc_run_id }}
          run-id: ${{ inputs.mc_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/e2e_mc/b3-mc-heldout-normal-s11-n200-run${{ inputs.mc_run_id }}
      - uses: actions/download-artifact@v5
        with:
          name: b3-mc-heldout-normal-s12-n200-run${{ inputs.mc_run_id }}
          run-id: ${{ inputs.mc_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/e2e_mc/b3-mc-heldout-normal-s12-n200-run${{ inputs.mc_run_id }}
      - uses: actions/download-artifact@v5
        with:
          name: b3-mc-stress-normal-s20-n200-run${{ inputs.mc_run_id }}
          run-id: ${{ inputs.mc_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/e2e_mc/b3-mc-stress-normal-s20-n200-run${{ inputs.mc_run_id }}
      - uses: actions/download-artifact@v5
        with:
          name: b3-mc-stress-normal-s21-n200-run${{ inputs.mc_run_id }}
          run-id: ${{ inputs.mc_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/e2e_mc/b3-mc-stress-normal-s21-n200-run${{ inputs.mc_run_id }}
      - uses: actions/download-artifact@v5
        with:
          name: b3-mc-stress-normal-s22-n200-run${{ inputs.mc_run_id }}
          run-id: ${{ inputs.mc_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: incoming/e2e_mc/b3-mc-stress-normal-s22-n200-run${{ inputs.mc_run_id }}
      - name: Run bounded Discovery-to-confirmation smoke using existing matrices
        env:
          T2_R_IMAGE: ghcr.io/alrier/t3-r@sha256:658e61478909fe688bc2d47837f7e09d64b4724ba1ff84bc807e901bf7931e16
          T3_MC_ARCHIVE: incoming/e2e_mc
          T3_SMOKE_OUT: artifacts/v3_downstream_e2e_smoke
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: bash scripts/run_r_in_container.sh Rscript scripts/t3_b3_downstream_e2e_smoke.R
      - uses: actions/upload-artifact@v4
        with:
          name: t3-b3-downstream-e2e-smoke-run${{ github.run_id }}
          path: artifacts/v3_downstream_e2e_smoke
          if-no-files-found: error
          retention-days: 90
